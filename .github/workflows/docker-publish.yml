name: Publish Docker image to GHCR

# Companion to release.yml — when a v* tag is pushed (or manually triggered),
# build the MCP server container and push to ghcr.io/<owner>/maf-autopilot.
#
# Image tags emitted:
#   - <version>           e.g. 1.3.0-alpha-5
#   - <major>.<minor>     e.g. 1.3
#   - <major>             e.g. 1
#   - latest              (only for non-prerelease versions)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (e.g. 1.3.0-alpha-5). Leave blank to use the latest git tag.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
      # SEC-14: also fire for unprefixed numeric tags (`1.13.0`) — GitHub's UI
      # release-create flow defaults to no `v`. Without this the image silently
      # drifted out of lockstep with release.yml (which already matches both).
      - '[0-9]*'

permissions:
  contents: read
  packages: write   # required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Phase 3.1 — validate workflow_dispatch input BEFORE any privileged step.
  # The build-and-push job has `packages: write` on GHCR.
  validate-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate version input shape
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -z "$INPUT" ]; then
            echo "No version input — will use git tag"
            exit 0
          fi
          if ! echo "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Invalid version input shape: $INPUT (must be semver)"
            exit 1
          fi

  # SEC-14: gate image publishing on the test suite so an untested build can never
  # ship — including the manual-dispatch path, where release.yml never ran. Runs the
  # same solution tests as release.yml against the tagged/dispatched commit.
  test:
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup .NET (net8/9/10 — the nupkg multi-targets all three)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore (locked mode)
        run: dotnet restore maf-autopilot.sln --locked-mode
      - name: Test
        run: dotnet test maf-autopilot.sln --configuration Release --no-restore --logger "console;verbosity=minimal"

  build-and-push:
    needs: [validate-inputs, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # WM-33: fetch tags so the blank-version dispatch path can resolve the
          # latest git tag, as the input description documents.
          fetch-depth: 0

      - name: Determine version
        id: version
        # Phase 3.2 — read input via env: redirect; reference $INPUT_VERSION
        # as a shell variable. Eliminates template-injection surface.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          IS_TAG=false
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_TAG=true
          elif [[ "$GITHUB_REF" == refs/tags/[0-9]* ]]; then
            # SEC-14: unprefixed numeric tag (mirrors release.yml + the trigger above).
            VERSION="${GITHUB_REF#refs/tags/}"
            IS_TAG=true
          else
            # WM-33: blank-version manual dispatch — use the latest git tag, as the
            # input description promises (the old else-branch aborted here instead).
            VERSION=$(git tag --list 'v[0-9]*' '[0-9]*' --sort=-creatordate | head -1 | sed 's/^v//')
            if [ -z "$VERSION" ]; then
              echo "❌ No version supplied and no v*/numeric tags found — aborting."
              exit 1
            fi
            echo "Using latest git tag: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT

          # Mark prereleases — they don't get the `latest` tag. SEC-28-aligned: ANY
          # hyphen is a SemVer prerelease label (-dev/-nightly/… too), not just four.
          if echo "$VERSION" | grep -q '-'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Building image for version: $VERSION"

      - name: Guard — tag commit must be on main (SEC-13)
        # Keep tag-triggered GHCR publishing on reviewed history, matching release.yml.
        # Manual dispatch remains an explicit maintainer action and is not tag-gated.
        if: steps.version.outputs.is_tag == 'true'
        run: |
          git fetch --no-tags --depth=2147483647 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not an ancestor of origin/main — refusing to publish an image from a commit that isn't on the reviewed main branch."
            exit 1
          fi
          echo "✅ Tag commit is on main."

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image summary
        # Phase 7.G fixup — env-redirect `steps.*.outputs.*` so the run: block
        # contains no template substitutions. `env.*` references inside another
        # `env:` block are valid GitHub Actions syntax (the runner resolves them
        # before the shell sees the value).
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          PULL_URL: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          echo "## 🐳 Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${PULL_URL}:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
