name: MAF AI Auto-Fill TODOs

# Opens an issue for the GitHub Copilot Coding Agent to fill in the TODO
# placeholders left by `maf-release-watcher.yml` after it auto-extracted
# breaking-change registry entries from a new MAF release.
#
# Why an issue (not a direct LLM call):
# - Uses the existing GitHub Copilot subscription — no extra secret.
# - GitHub-native: Copilot's tools, Copilot's review surface, Copilot's audit
#   trail. No Anthropic / OpenAI dependency.
# - PR-based output: for AI-INFERRED content (where uncertainty is real), a PR
#   review step gives the maintainer a chance to eyeball the inferences before
#   they hit main. Routine watcher commits (raw data) still bypass PRs.
#
# Flow:
#   1. This workflow runs (either dispatched manually or called by the watcher).
#   2. It opens an issue titled "Fill TODOs for MAF X.Y.Z" with the full
#      filling prompt as the body, assigned to `Copilot` (the Coding Agent bot).
#   3. Copilot picks up the issue (within ~minutes), creates a branch, makes
#      the edits, opens a PR labelled `maf-release,ai-fill`.
#   4. You review the PR and merge (or set up auto-merge on the label).
#
# Requires:
# - The repository has GitHub Copilot Coding Agent (or Claude/Codex Coding
#   Agent) enabled. Toggle at https://github.com/<owner>/<repo>/settings/copilot
#   (one of "Allow Copilot/Claude/Codex coding agent" must be ON).
# - Secret COPILOT_ASSIGN_PAT: fine-grained PAT owned by a Copilot-enabled user,
#   with Issues R/W + Contents R/W + Pull requests R/W + Metadata R on this repo
#   only. SEC-29: Actions R/W is NO LONGER required — the only Actions-API consumer
#   (the cross-workflow dispatch) was removed in the 2026-06-28 "C" refactor. Rotate
#   the PAT down to this union.
#   This SAME secret is reused by maf-release-watcher.yml (Contents R/W, to push
#   the per-version scaffold branch) — provision the full union here, not a
#   narrower scope. [task 3.5]
#   This is REQUIRED for auto-assignment — see the long comment block on the
#   "Open issue assigned to Copilot Coding Agent" step below for why
#   GITHUB_TOKEN is unusable here. If the secret is missing the workflow still
#   runs (the issue gets created), only auto-assignment is skipped with a
#   loud annotation explaining the gap.

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'MAF version to fill TODOs for (e.g. 1.4.0, 1.5.0)'
        required: true
      bot:
        description: 'Coding Agent to assign (copilot|claude|codex). Default: copilot. Agent integrations choose an account-supported model; do not assume a named model is available.'
        required: false
        default: 'copilot'
      target_branch:
        description: 'Scaffold branch that carries the TODO placeholders. Blank = release-watcher/maf-<target_version> (WM-28: the watcher PRs, no longer pushes to main).'
        required: false
        default: ''
  workflow_call:
    inputs:
      target_version:
        type: string
        required: true
      bot:
        type: string
        required: false
        default: 'copilot'
      target_branch:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  # Phase 3.1 — validate workflow_dispatch / workflow_call inputs BEFORE any
  # privileged step runs. The `open-issue-for-copilot` job uses
  # COPILOT_ASSIGN_PAT (an admin PAT). A malformed target_version (e.g.
  # "1.4.0; rm -rf /") would otherwise hit the env-redirect at line 68 and
  # the downstream shell var expansion would render it inert — but defense
  # in depth: catch the bad shape upstream with a regex.
  validate-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate inputs
        env:
          TARGET: ${{ inputs.target_version }}
          BOT: ${{ inputs.bot || 'copilot' }}
          BRANCH: ${{ inputs.target_branch }}
        run: |
          if ! echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Invalid target_version input shape: $TARGET (must be semver)"
            exit 1
          fi
          case "$BOT" in
            claude|copilot|codex) ;;
            *) echo "::error::Invalid bot input: $BOT (must be claude|copilot|codex)" ; exit 1 ;;
          esac
          # WM-28: same branch-name shape the watcher validates for push_target.
          if [ -n "$BRANCH" ] && ! echo "$BRANCH" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Invalid target_branch: $BRANCH (branch-name characters only)"
            exit 1
          fi

  open-issue-for-copilot:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Ensure required labels exist (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh label create` fails if the label already exists, but `--force`
          # makes it update-or-create. We don't actually care about color
          # consistency, just that the label exists so `gh issue create
          # --label` doesn't error.
          gh label create "maf-release" \
            --color "0e8a16" \
            --description "Auto-generated by maf-release-watcher / fill workflows" \
            --force || true
          gh label create "ai-fill" \
            --color "1d76db" \
            --description "AI auto-fill of TODOs (Copilot Coding Agent)" \
            --force || true

      - name: Open issue assigned to chosen Coding Agent
        env:
          BOT_NAME: ${{ inputs.bot || 'copilot' }}
          # COPILOT_ASSIGN_PAT is a fine-grained PAT owned by a Copilot-enabled
          # user. It's REQUIRED for auto-assigning the Coding Agent bot:
          # `addAssigneesToAssignable` categorically rejects GITHUB_TOKEN and
          # every other GitHub App installation token, because Copilot bills
          # agent runs against a human Copilot subscription. (Confirmed
          # 2026-05-17 by upstream gh-aw issue #19765 + Copilot maintainer
          # statement: "Copilot does not support bot accounts for issue
          # assignment".) If the secret isn't set, fall back to GITHUB_TOKEN
          # so the issue still gets created — only the auto-assignment fails,
          # with a loud annotation pointing at the missing secret.
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN_KIND: ${{ secrets.COPILOT_ASSIGN_PAT && 'pat' || 'github-token' }}
          TARGET: ${{ inputs.target_version }}
          BRANCH: ${{ inputs.target_branch }}   # WM-28: blank → builder defaults to release-watcher/maf-<target>
        run: |
          # Render the issue body via a Python template helper. Previously
          # this was a ~180-line bash heredoc with every backtick escaped
          # (\`...\`); a single missed escape would have corrupted the
          # whole body. The helper reads ai_fill_issue_prompt.md.tpl and
          # derives the major+minor registry ID segment, then substitutes the
          # template placeholders with no shell parsing.
          ISSUE_BODY=$(python3 .github/scripts/build_ai_fill_issue_body.py)

          # WM-30: idempotent. Re-dispatching for the same version must not spawn a
          # duplicate issue + a duplicate paid Coding-Agent run. Dedupe on the version-
          # stable title prefix (the "(assigned to: X)" suffix varies by bot).
          EXISTING=$(gh issue list --label ai-fill --state open --json number,title \
            --jq ".[] | select(.title | startswith(\"Fill TODOs for MAF ${TARGET} \")) | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "::notice::Open fill issue #$EXISTING already exists for MAF $TARGET — commenting instead of duplicating."
            gh issue comment "$EXISTING" --body "Re-dispatch requested (bot: $BOT_NAME) — reusing this issue rather than opening a duplicate."
            exit 0
          fi

          # Two-step pattern: create the issue first, then assign the chosen
          # Coding Agent via GraphQL. The standard `gh issue edit
          # --add-assignee` fails because gh CLI looks up assignees via REST
          # `/users/<name>`, and these bots aren't returned by that endpoint
          # (they're Bots, not Users). The GraphQL mutation
          # `addAssigneesToAssignable` accepts global node IDs directly, which
          # is what the GitHub UI uses under the hood.

          ISSUE_URL=$(gh issue create \
            --title "Fill TODOs for MAF $TARGET (assigned to: $BOT_NAME)" \
            --body "$ISSUE_BODY" \
            --label "maf-release,ai-fill")
          echo "✅ Issue created: $ISSUE_URL"

          ISSUE_NUM=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')

          # Look up the issue's GraphQL global node ID.
          ISSUE_NODE_ID=$(gh api graphql \
            -f query='query($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $num) { id }
              }
            }' \
            -f owner="${GITHUB_REPOSITORY%%/*}" \
            -f repo="${GITHUB_REPOSITORY##*/}" \
            -F num="$ISSUE_NUM" \
            --jq '.data.repository.issue.id')

          # Resolve a coding-agent GraphQL node ID via suggestedActors. Login
          # names are stable: copilot->copilot-swe-agent, claude->anthropic-code-
          # agent, codex->openai-code-agent.
          #
          # Bot-FALLBACK (self-heal): try the requested bot first, then the others
          # in priority order, and use the first one that is ASSIGNABLE — so the
          # fill still gets assigned if the preferred agent isn't enabled here.
          #
          # CAVEAT it can NOT fix: a bot that IS assignable but whose LLM model was
          # deprecated (the 2026-06 "model not available for integrator claude-code"
          # failure). That happens later, inside the agent's own async run, with no
          # signal back to this workflow. If a fill PR dies on a model error,
          # re-dispatch with a different enabled bot or update that integration to
          # an account-supported model. The workflow does not pin a model name.
          needle_for() {
            case "$1" in
              copilot) echo "copilot-swe-agent" ;;
              claude)  echo "anthropic-code-agent" ;;
              codex)   echo "openai-code-agent" ;;
            esac
          }

          ACTORS_JSON=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 50) {
                  nodes {
                    ... on Bot { id login }
                    ... on User { id login }
                  }
                }
              }
            }' \
            -f owner="${GITHUB_REPOSITORY%%/*}" \
            -f repo="${GITHUB_REPOSITORY##*/}")

          # Priority: requested bot first, then the rest (order-preserving dedupe).
          ORDER=$(printf '%s\n' "$BOT_NAME" copilot claude codex | awk '!seen[$0]++')
          BOT_ID=""; RESOLVED_BOT=""
          for cand in $ORDER; do
            NEEDLE=$(needle_for "$cand")
            [ -z "$NEEDLE" ] && continue
            ID=$(echo "$ACTORS_JSON" | jq -r ".data.repository.suggestedActors.nodes[] | select(.login==\"$NEEDLE\") | .id" | head -1)
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              BOT_ID="$ID"; RESOLVED_BOT="$cand"
              break
            fi
            echo "Coding agent '$cand' ($NEEDLE) not assignable — trying next."
          done

          if [ -z "$BOT_ID" ]; then
            # Task 4.9 — issue already created; not resolving ANY agent is non-
            # critical: warn + skip auto-assignment, never fail the job.
            echo "::warning title=Coding Agent not resolved::No coding agent (copilot/claude/codex) is assignable on this repo. Issue $ISSUE_URL created but NOT auto-assigned — enable one at https://github.com/${GITHUB_REPOSITORY}/settings/copilot, then assign manually."
            exit 0
          fi
          if [ "$RESOLVED_BOT" != "$BOT_NAME" ]; then
            echo "::notice title=Coding Agent fallback::Requested '$BOT_NAME' not assignable; fell back to '$RESOLVED_BOT'."
          fi
          echo "Resolved bot $RESOLVED_BOT -> $BOT_ID"
          # Keep COPILOT_BOT_ID name for back-compat with downstream messages.
          COPILOT_BOT_ID="$BOT_ID"

          # Best-effort: assign via the additive GraphQL mutation. Uses
          # `addAssigneesToAssignable` (not `replaceActorsForAssignable`) so
          # we never accidentally remove human assignees who were added later.
          #
          # Capture the actual GraphQL error to a temp file (don't suppress with
          # >/dev/null 2>&1 — that hid the real "Bot does not have access" error
          # for days during the v1.0 release. Discovered 2026-05-17.)
          GRAPHQL_ERR=$(mktemp)
          if gh api graphql \
              -f query='mutation($assignable: ID!, $actor: ID!) {
                addAssigneesToAssignable(input: { assignableId: $assignable, assigneeIds: [$actor] }) {
                  assignable {
                    ... on Issue { number assignees(first: 5) { nodes { login } } }
                  }
                }
              }' \
              -f "assignable=$ISSUE_NODE_ID" \
              -f "actor=$COPILOT_BOT_ID" \
              >/dev/null 2>"$GRAPHQL_ERR"; then
            echo "✅ Assigned to Copilot Coding Agent — work should start within minutes."
          else
            echo ""
            echo "⚠️  Could NOT auto-assign Copilot Coding Agent via GraphQL."
            echo ""
            echo "    Actual GraphQL error from the API:"
            sed 's/^/      /' "$GRAPHQL_ERR" | head -5
            echo ""
            if [ "$GH_TOKEN_KIND" = "github-token" ]; then
              echo "    ROOT CAUSE (definitive — investigated 2026-05-17):"
              echo "      This step ran with GITHUB_TOKEN. The Copilot Coding Agent"
              echo "      assignment API rejects EVERY non-user token by design —"
              echo "      including GITHUB_TOKEN, GitHub App installation tokens, and"
              echo "      every other automation credential. It only accepts a fine-"
              echo "      grained PAT owned by a Copilot-enabled user. No workflow"
              echo "      permission scope fixes this — it's a GitHub-side policy."
              echo ""
              echo "    FIX (one-time):"
              echo "      1. Create a fine-grained PAT at"
              echo "         https://github.com/settings/personal-access-tokens/new"
              echo "         Resource owner: your user."
              echo "         Repository access: only this repo."
              echo "         Repo permissions: Contents R/W, Issues R/W, PRs R/W,"
              echo "         Metadata R. (SEC-29: Actions R/W no longer needed.)"
              echo "      2. Save it as repo secret COPILOT_ASSIGN_PAT at"
              echo "         https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
              echo "      3. Re-run this workflow."
              echo ""
              echo "    Reference: upstream gh-aw issue #19765 + Copilot maintainer"
              echo "    statement \"Copilot does not support bot accounts for issue"
              echo "    assignment\"."
            else
              echo "    A PAT was used (COPILOT_ASSIGN_PAT is set), so the bot-token-"
              echo "    rejection class of failure is ruled out. Other causes to check:"
              echo "      1. PAT scopes — Issues R/W, Repository access on this repo."
              echo "      2. The PAT owner must have Copilot Pro/Pro+/Business/Enterprise"
              echo "         AND have the Coding Agent enabled in their settings."
              echo "      3. Bot global node ID may have rotated (currently $COPILOT_BOT_ID)."
              echo "         Verify with: gh api graphql -f query='{ repository(owner:\\\"X\\\", name:\\\"Y\\\") { suggestedActors(capabilities:[CAN_BE_ASSIGNED]) { nodes { ... on Bot { id login } } } } }'"
            fi
            echo ""
            echo "    To proceed manually THIS run:"
            echo "      Open $ISSUE_URL → Assignees → select 'Copilot' / 'Claude'."
            echo ""
            # Emit a GitHub-Actions-UI-level annotation so this shows on the run summary,
            # not just in the log. The workflow itself stays successful (the issue WAS
            # created — only the assignment failed); the annotation makes the gap loud.
            echo "::warning title=Coding Agent not assigned (token: $GH_TOKEN_KIND)::Issue $ISSUE_URL created but bot was not auto-assigned. See log for root cause + fix."
          fi
          rm -f "$GRAPHQL_ERR"
