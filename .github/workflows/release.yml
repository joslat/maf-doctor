name: Release maf-doctor

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.3.0-alpha-5). Leave blank to use version in csproj.'
        required: false
        default: ''
  push:
    tags:
      # Match BOTH canonical `v`-prefixed semver tags (`v1.3.0-alpha-5`) AND
      # tags that start with a digit directly (`1.3.0-alpha-5`). Without the
      # second pattern, releases tagged via GitHub's UI release-create flow
      # without a leading `v` silently fail to trigger the workflow — which
      # is exactly what happened to `1.3.0-alpha-4` and `1.3.0-alpha-5`.
      - 'v*'
      - '[0-9]*'

jobs:
  # Phase 3.1 — validate workflow_dispatch inputs BEFORE any privileged step
  # runs. release.yml has NUGET_API_KEY in scope downstream; a malformed
  # `version` input is the highest-value injection lane in this repo.
  validate-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate version input shape
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -z "$INPUT" ]; then
            echo "No version input — will use tag or csproj"
            exit 0
          fi
          if ! echo "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Invalid version input shape: $INPUT (must be semver)"
            exit 1
          fi

  release:
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # SEC-13: OIDC token + attestation write so the build produces a signed
      # provenance attestation over the published .nupkg files.
      id-token: write
      attestations: write

    steps:
      # SEC-13: full history so the tag-on-main guard's `merge-base --is-ancestor`
      # can see whether the tagged commit is actually on the reviewed main branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET (all three runtimes — nupkg multi-targets net8/9/10)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Determine version
        id: version
        # Phase 3.2 — read inputs via `env:` redirect, not `${{ }}` templating
        # inside the run block. Eliminates the template-injection surface.
        #
        # F-15 (2026-07-19 security assessment) — `override` and `is_tag` are
        # computed HERE, once, as the single source of truth for the two
        # downstream steps that used to each duplicate their own condition.
        # The bug this closes: the "Override version in csproj" step's `if:`
        # previously checked `inputs.version != '' || startsWith(ref, 'v')`
        # only — it never covered the unprefixed-tag branch added below, even
        # though THIS step's VERSION computation already handled it. Pushing
        # an unprefixed tag (`1.13.0`) therefore computed the right VERSION
        # for the release notes but silently packed whatever `<Version>` was
        # already sitting in the csproj — a real tag/package mismatch, not
        # just a cosmetic one. Deriving both flags from the same branch that
        # sets VERSION makes that class of drift structurally impossible: a
        # future third tag pattern only has to be added here, not in three
        # separate `if:` conditions across the job.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          IS_TAG=false
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            OVERRIDE=true
            echo "Using input version: $VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Canonical: tag with `v` prefix (e.g. `v1.3.0-alpha-5`).
            VERSION="${GITHUB_REF#refs/tags/v}"
            OVERRIDE=true
            IS_TAG=true
            echo "Using tag version (v-prefixed): $VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/[0-9]* ]]; then
            # Tolerant: tag starts with a digit (e.g. `1.3.0-alpha-5` — what GitHub
            # UI release-create defaults to if the author omits the `v`).
            VERSION="${GITHUB_REF#refs/tags/}"
            OVERRIDE=true
            IS_TAG=true
            echo "Using tag version (unprefixed): $VERSION"
          else
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/maf-autopilot/maf-autopilot.csproj)
            OVERRIDE=false
            echo "Using csproj version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "override=$OVERRIDE" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Guard — tag commit must be on main (SEC-13)
        # A tag can point at ANY commit (incl. one never reviewed/merged). Publishing
        # from it would attach the release notes + NUGET_API_KEY to unreviewed code.
        # Only enforced on the tag-push path; workflow_dispatch is a manual maintainer
        # action with no tag ref. Requires fetch-depth: 0 on checkout above.
        if: steps.version.outputs.is_tag == 'true'
        run: |
          git fetch --no-tags --depth=2147483647 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not an ancestor of origin/main — refusing to publish a package from a commit that isn't on the reviewed main branch."
            exit 1
          fi
          echo "✅ Tag commit is on main."

      - name: Override version in csproj
        if: steps.version.outputs.override == 'true'
        # Phase 7.G fixup — env-redirect `steps.*.outputs.*` like we do for
        # `inputs.*`. Defense in depth: VERSION is already semver-validated
        # upstream by the validate-inputs job, but eliminating the templating
        # site entirely is the cleaner invariant.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Keep BOTH packages in version lockstep (the server tool + the analyzer).
          # Previously only the server csproj was overridden, so the analyzer
          # shipped at its stale csproj <Version> and `--skip-duplicate` silently
          # skipped re-publishing it. Override both from the tag/input.
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" src/maf-autopilot/maf-autopilot.csproj
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" src/maf-autopilot.Analyzers/maf-autopilot.Analyzers.csproj
          echo "Set <Version> to $VERSION on both the server tool and the analyzer."

      - name: Verify packed version matches the resolved version
        if: steps.version.outputs.override == 'true'
        # F-15 — belt-and-suspenders: fail loudly if the override step above
        # somehow didn't take (e.g. a future refactor changes the sed target
        # without updating this check), rather than silently publishing a
        # mismatched package under the tag's release notes.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for csproj in src/maf-autopilot/maf-autopilot.csproj src/maf-autopilot.Analyzers/maf-autopilot.Analyzers.csproj; do
            ACTUAL=$(grep -oP '(?<=<Version>)[^<]+' "$csproj")
            if [ "$ACTUAL" != "$VERSION" ]; then
              echo "::error::$csproj has <Version>$ACTUAL</Version>, expected $VERSION — refusing to publish a mismatched package."
              exit 1
            fi
          done

      - name: Restore
        # F-27 — locked mode; see build-test.yml for the full rationale.
        # Release builds are exactly where a silently-drifted transitive
        # dependency graph matters most.
        run: dotnet restore maf-autopilot.sln --locked-mode

      - name: Test (solution-level — gates analyzer + main project)
        run: |
          dotnet test maf-autopilot.sln \
            --configuration Release \
            --no-restore \
            --logger "console;verbosity=minimal"

      - name: Pack server tool
        run: |
          dotnet pack src/maf-autopilot/maf-autopilot.csproj \
            --configuration Release \
            --no-restore \
            --output src/dist/
          echo "Packed: $(ls src/dist/*.nupkg)"

      - name: Pack analyzer package
        # NU5017 false-positive: the analyzer csproj uses `<None Include ... Pack="true">`
        # to ship the analyzer DLL under `analyzers/dotnet/cs/`. NuGet pack's heuristic
        # doesn't see that path and reports "no dependencies nor content" — fires as
        # an error on .NET SDK 10.0.300+ (Linux runner) but as a warning with exit 0
        # on 10.0.102 (Windows local). The nupkg IS produced correctly in both cases
        # (verified by `unzip -l` showing analyzers/dotnet/cs/*.dll present).
        # Workaround: tolerate the first pack's exit code and verify the main nupkg.
        # A second no-build pack enables the SDK build-output path only in an isolated
        # directory so NuGet can create the analyzer .snupkg. We copy only that symbol
        # package; the canonical main nupkg retains its single analyzer DLL layout.
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          dotnet pack src/maf-autopilot.Analyzers/maf-autopilot.Analyzers.csproj \
            --configuration Release \
            --no-restore \
            --output src/dist/
          PACK_EXIT=$?
          set -e
          MAIN_PACKAGE="src/dist/maf-doctor.Analyzers.${VERSION}.nupkg"
          if [ ! -f "$MAIN_PACKAGE" ]; then
            echo "::error::Analyzer nupkg was not produced (pack exit code was $PACK_EXIT)"
            exit 1
          fi

          SYMBOL_DIR="$RUNNER_TEMP/maf-doctor-analyzer-symbols-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$SYMBOL_DIR"
          dotnet pack src/maf-autopilot.Analyzers/maf-autopilot.Analyzers.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output "$SYMBOL_DIR" \
            -p:IncludeBuildOutput=true \
            -p:BuildOutputTargetFolder=analyzers/dotnet/cs
          SYMBOL_PACKAGE="$SYMBOL_DIR/maf-doctor.Analyzers.${VERSION}.snupkg"
          if [ ! -f "$SYMBOL_PACKAGE" ]; then
            echo "::error::Analyzer symbol package was not produced"
            exit 1
          fi
          cp "$SYMBOL_PACKAGE" src/dist/
          echo "Packed: $MAIN_PACKAGE and src/dist/$(basename "$SYMBOL_PACKAGE")"

      - name: Verify release package artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/verify_release_packages.py --dist src/dist --version "$VERSION"

      - name: Attest build provenance (SEC-13)
        # Signed provenance over the exact packages this run produced — makes a
        # published package attributable to this workflow run + commit. Runs before
        # publish so a package can't be pushed without its attestation. SHA-pinned
        # (v4.1.1) per the repo-wide supply-chain hardening.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'src/dist/*nupkg'

      - name: Publish to NuGet
        # SEC-13: the API key is read from env: (not ${{ }}-templated into the run
        # block) for template-injection safety + log hygiene. NOTE: `--api-key
        # "$NUGET_API_KEY"` still expands into the dotnet argv (visible via /proc on
        # the runner). Fully removing that requires NuGet.org Trusted Publishing
        # (OIDC) — enable it on the account and drop this secret entirely.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push src/dist/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        # Fire for both v-prefixed and unprefixed numeric tags (steps.version's
        # is_tag output, F-15 — previously a 10-way startsWith OR-chain
        # duplicating the same tag-pattern logic as the "Determine version"
        # step, with its own chance to drift out of sync). Skip on
        # workflow_dispatch (no tag ref) — in that case the user typically
        # created the Release manually via the GitHub UI before dispatching.
        if: steps.version.outputs.is_tag == 'true'
        # SHA-pinned to softprops/action-gh-release v3.0.0 per supply-chain hardening:
        # a major-tag pin would let an upstream maintainer's compromised account push
        # arbitrary code into our release workflow with NUGET_API_KEY in scope.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: src/dist/*nupkg
          generate_release_notes: true
