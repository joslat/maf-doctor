name: MAF AI Semantic Review

# Rung-2 of the trust ladder for ai-fill PRs (rung-1 is the deterministic
# `verify-registry` mechanical check). When an ai-fill PR is marked ready for
# review, this workflow calls a Claude / GPT model via GitHub Copilot CLI,
# asks it to check each changed registry entry against
# the raw `dotnet-inspect` diff (preserved in `notes:`), and posts the
# findings as a single PR review comment.
#
# Uses the repository owner's Copilot subscription — no long-lived secret,
# Anthropic / OpenAI account, or third-party API key. The only auth is the
# short-lived GITHUB_TOKEN with `copilot-requests: write` permission. Copilot
# tools stay disabled, so PR-controlled prompt text cannot execute anything.
#
# Currently in COMMENT-ONLY mode: the verdict is in the comment; the
# human still merges. To make it a hard gate (rung-3), flip
# COMMENT_ONLY_MODE = False in ai_review_post_comment.py and add this
# workflow as a required status check in branch protection settings.

on:
  pull_request:
    # No `paths:` filter — empirically broken with ready_for_review events
    # (state flips carry no commit deltas, so paths matching is unreliable
    # and the trigger silently skips). Observed 2026-05-17 on PR #26.
    # Instead, the build_prompt step emits skip=true if no entries actually
    # changed, gating downstream AI inference + post-comment.
    # WM-15: include `opened` — the watcher's non-draft additive-auto-green scaffold PRs
    # are opened non-draft and were never reviewed without it. The `draft == false` job
    # condition still suppresses draft opens; the build-prompt skip gate suppresses
    # non-registry PRs before any model call.
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (manual re-run)'
        required: true

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  # Phase 3.1 — validate workflow_dispatch inputs BEFORE the semantic-review
  # job runs. semantic-review has `pull-requests: write` + `copilot-requests: write`; a
  # malformed pr_number could otherwise trick `gh pr view` (mitigated by gh's
  # own arg parsing today, but defense in depth).
  validate-inputs:
    # Only run validation on the manual dispatch path; pull_request events
    # carry no inputs to validate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate inputs
        env:
          PR_NUM: ${{ inputs.pr_number }}
        run: |
          if ! echo "$PR_NUM" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::Invalid pr_number input shape: $PR_NUM (must be a positive integer)"
            exit 1
          fi

  semantic-review:
    # `needs` chain: validate-inputs only runs on workflow_dispatch, so we
    # express "skip validation on pull_request" via `always() && (...)`. The
    # pull_request path goes straight to semantic-review without validation
    # (no inputs to validate). The workflow_dispatch path requires validate-inputs
    # to have succeeded.
    needs: [validate-inputs]
    # Scope: automatic reviews run only on release-watcher PRs (budget decision,
    # 2026-10-01: Copilot credits are limited). The old warning about branch-prefix
    # scoping (fill PRs on unexpected branches were silently skipped) no longer
    # applies: the agentic fill only works on release-watcher/maf-* branches; its
    # pre-step enforces the prefix. Any other PR can still be reviewed on demand
    # with workflow_dispatch (pr_number). Within scope, the build-prompt step still
    # no-ops (skip=true) when no registry entries changed.
    if: >
      always() &&
      (needs.validate-inputs.result == 'success' || needs.validate-inputs.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.draft == false &&
         startsWith(github.event.pull_request.head.ref, 'release-watcher/maf-'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR coordinates
        id: pr
        # Phase 3.2 — read inputs via env: redirect; reference $INPUT_PR_NUM
        # as a shell variable. Eliminates template-injection surface.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUM: ${{ inputs.pr_number }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PR_NUM="$INPUT_PR_NUM"
            # --repo so gh doesn't try to infer from a not-yet-existent git context
            # (this step runs before actions/checkout).
            DATA=$(gh pr view "$PR_NUM" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid)
            BASE=$(echo "$DATA" | jq -r .baseRefOid)
            HEAD=$(echo "$DATA" | jq -r .headRefOid)
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "head=$HEAD" >> $GITHUB_OUTPUT
          echo "Resolved: PR #$PR_NUM (base=$BASE head=$HEAD)"

      - name: Checkout trusted PR base (so the scripts are present)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Deliberately NOT checking out the PR head — the PR branch (created
          # by the filler bot) doesn't contain the rung-2 review scripts. We
          # need this workflow's scripts from main, then we git-fetch the PR
          # refs separately so `git show $SHA:registry.yaml` works.
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head + base refs
        env:
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          # Fetching the PR head ref makes HEAD_SHA reachable. BASE_SHA is
          # usually on main already (fetched by the previous checkout with
          # depth=0), but we force-fetch it too for safety.
          git fetch origin "pull/$PR_NUM/head" --depth=20
          # Sanity-check that both SHAs are now reachable.
          for SHA in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "$SHA" 2>/dev/null; then
              echo "::error::SHA $SHA not reachable after fetching pull/$PR_NUM/head."
              exit 1
            fi
            echo "$SHA reachable."
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install deps
        # F-13 — exact-pinned rather than floating latest.
        run: pip install pyyaml==6.0.1

      - name: Build review prompt
        id: build
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          python3 .github/scripts/ai_review_build_prompt.py > .ai-review-prompt.txt
          BYTES=$(wc -c < .ai-review-prompt.txt | tr -d ' ')
          ENTRIES_COUNT=$(jq length < .ai-review-entries.json)
          echo "Prompt bytes: $BYTES; entries to review: $ENTRIES_COUNT"
          if [ "$ENTRIES_COUNT" = "0" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice title=No registry entries changed::Skipping AI review (no entries in scope)."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js for Copilot CLI
        if: steps.build.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0

      - name: Install Copilot CLI
        if: steps.build.outputs.skip != 'true'
        # Exact-pinned: avoid silently changing the executable that receives
        # the short-lived Copilot request token.
        run: npm install --global @github/copilot@1.0.80

      - name: AI inference (GitHub Copilot)
        if: steps.build.outputs.skip != 'true'
        id: ai
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222  # v3
        with:
          provider: copilot
          prompt-file: .ai-review-prompt.txt
          # Empty `model` lets the Copilot CLI select a model available to this
          # seat. Hard-coding gpt-4.1 failed when that model was unavailable, and
          # ai-inference v3 defaults `model` to gpt-4.1 when the input is omitted
          # (2026-10-01: semantic-review failed right after the v2 -> v3 bump).
          model: ''
          # Do not set copilot-allow-tools. The action denies every Copilot
          # tool by default, containing prompt-injection impact to response text.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post review comment to PR
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}   # REP-10: stamp which push the verdict covers
        run: python3 .github/scripts/ai_review_post_comment.py
