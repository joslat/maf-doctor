name: MAF AI-Fill PR Verify

# #5 polish (2026-05-13) — runs the verification gate against AI-filled
# registry and watcher-managed PRs. It triggers for every pull request so the
# required check always reports, then uses the proven base-to-head diff to
# decide whether full verification is in scope; labels are not trusted gates.
#
# Why this exists: GitHub Copilot Coding Agent fills the TODO placeholders
# left by `maf-release-watcher`. Quality is good but inconsistent. Common
# failure modes we've seen:
#   - example_before == example_after (a non-migration)
#   - fix_description is "TODO" or empty
#   - examples have unbalanced braces (Copilot left a half-snippet)
#   - guide_section is "TBD" / "TODO" instead of the literal "N/A"
#
# This workflow builds verifier code from the trusted PR base and runs it
# against the PR HEAD artifacts as data. If verification fails, the workflow exits non-zero, which blocks
# the PR's auto-merge (if branch protection / required-status-checks is
# configured for this check).
#
# The maintainer can still manually merge the PR if the verification gate
# is being overly strict — the gate is advisory, not mandatory.

on:
  pull_request:
    types: [opened, synchronize, labeled, ready_for_review, reopened]
    # No `paths:` filter — branch protection requires this check to report
    # a status on EVERY PR (otherwise PRs that don't touch registry.yaml
    # get blocked by "missing required check"). The job filters internally:
    # if registry.yaml isn't in the diff, it reports success trivially.

# SEC-11: this job handles PR-supplied (possibly fork) data, so it must NOT hold
# write scope. Verifier code is built only from the trusted base checkout. It
# uploads its comment body + PR number as an artifact; the
# workflow_run companion (maf-pr-audit-comment.yml) posts the sticky comment from the
# base-repo context without ever touching fork code.
permissions:
  contents: read

# WM-35: cancel superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Always run (so branch protection's required-status-check sees a result
    # on every PR). The first step decides whether to do real verification
    # or report trivial success based on the actual diff.
    runs-on: ubuntu-latest
    steps:
      # Keep PR data and trusted verifier code in separate trees. No executable
      # or script from the PR checkout is run by this privileged release gate.
      - name: Checkout PR head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: pr

      # `pull_request.base.sha` is the base captured when the PR event was
      # created and can remain stale while a long-running release PR is open.
      # Resolve the current base branch tip from this separate trusted checkout
      # and pin every later comparison/verifier invocation to that exact commit.
      - name: Checkout current trusted PR base verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted

      - name: Resolve current trusted base SHA
        id: trusted_base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_REF" ]; then
            echo "::error::Pull request base ref is empty; refusing to select trusted verifier code."
            exit 1
          fi
          BASE_SHA=$(git -C trusted rev-parse --verify "HEAD^{commit}")
          if [[ ! "$BASE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::Trusted base checkout did not resolve to one exact commit SHA."
            exit 1
          fi
          git -C trusted cat-file -e "${BASE_SHA}^{commit}"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved current trusted base $BASE_REF to $BASE_SHA"

      - name: Decide whether this PR is in scope
        id: scope
        env:
          BASE_SHA: ${{ steps.trusted_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Task 4.6 — in scope iff the PR DIFF touches a watcher-managed file
          # (registry.yaml / compatibility-matrix.md / a per-version migration
          # guide / .maf-version). Scope is driven by the diff ALONE — NOT by a
          # self-applied `ai-fill` label or a bot branch prefix. Relying on those
          # let a fill PR that forgot the label (or used an unexpected branch
          # prefix) silently report success while verifying NOTHING. Any edit to
          # these files deserves the structural verification.
          # Scope discovery is fail-closed. The resolved current base commit and
          # event HEAD must be reachable and `git diff` must succeed; an empty
          # list is trusted only after that proof.
          # Full ancestry is required to prove where the immutable obligations
          # blob first appeared; a shallow base fetch makes merge-base ambiguous.
          git -C pr fetch --no-tags origin "$BASE_SHA"
          git -C pr cat-file -e "${BASE_SHA}^{commit}"
          git -C pr cat-file -e "${HEAD_SHA}^{commit}"
          # Three-dot: the PR's own changes since its merge-base. A two-dot diff
          # against the current base tip would pull a stale branch into scope
          # merely because main changed watcher files after it was cut (#201).
          DIFF_FILES=$(git -C pr diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "Files changed in PR (since its merge-base):"
          echo "$DIFF_FILES" | sed 's/^/  /'

          if echo "$DIFF_FILES" | grep -qE '^(\.github/skills/maf-obsolete-api-registry/registry\.yaml|\.github/maf-scaffold-obligations/maf-[0-9]+\.[0-9]+\.[0-9]+\.json|docs/compatibility-matrix\.md|guides/maf-.*-migration-guide\.md|src/maf-autopilot/Tools/CompatibilityTool\.cs|\.github/scripts/(verify_crossfile_consistency|gen_guide_section|verify_ai_fill_delta)\.py|\.maf-version)$'; then
            echo "in_scope=true" >> $GITHUB_OUTPUT
            echo "::notice title=verify-registry in scope::PR touches watcher-managed files — running full rung-1 verification."
          else
            echo "in_scope=false" >> $GITHUB_OUTPUT
            echo "::notice title=verify-registry trivially passes::PR doesn't touch watcher-managed files — reporting success."
          fi

      - name: Autonomy envelope for release-watcher PRs (Z-02)
        id: envelope
        # Release-watcher scaffold PRs may auto-merge (A-02), so this required
        # check also proves they touch ONLY the scaffold/fill data paths. Any
        # change to workflows, scripts, or product code on such a branch fails
        # here and blocks merging, including auto-merge. The three-dot diff is
        # the PR's own change set (from the merge-base, as GitHub shows it); a
        # two-dot diff against the current base tip would also list everything
        # main gained after the branch was cut.
        env:
          BASE_SHA: ${{ steps.trusted_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            release-watcher/maf-*) ;;
            *) echo "Not a release-watcher PR; envelope not applicable."; exit 0 ;;
          esac
          ALLOWED='^(\.github/skills/maf-obsolete-api-registry/registry\.yaml|\.github/maf-scaffold-obligations/maf-[0-9]+\.[0-9]+\.[0-9]+\.json|\.github/maf-train-lock\.json|docs/compatibility-matrix\.md|guides/maf-[0-9a-z.-]+-migration-guide\.md|src/maf-autopilot/Tools/CompatibilityTool\.cs|\.maf-version)$'
          CHANGED=$(git -C pr diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          OUTSIDE=$(echo "$CHANGED" | grep -vE "$ALLOWED" | grep -v '^$' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error title=Autonomy envelope violated::A release-watcher PR changed files outside the scaffold/fill allowlist:"
            echo "$OUTSIDE" | sed 's/^/  /'
            exit 1
          fi
          echo "Autonomy envelope OK: only scaffold/fill data paths changed."

      - name: Setup .NET
        # Round-3 review fixup — continue-on-error so a transient setup-dotnet
        # failure doesn't skip every downstream step via the implicit
        # success() gate (same reasoning as the Restore/Build steps below).
        continue-on-error: true
        if: steps.scope.outputs.in_scope == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore maf-doctor (locked mode)
        # Round-2 review fixup — docs claimed "CI restores in --locked-mode"
        # as a blanket statement, but this job ran a plain `dotnet build`
        # with an implicit, non-strict restore. Matches build-test.yml's
        # restore-then-build split; continue-on-error for the same reason as
        # the build step below.
        continue-on-error: true
        if: steps.scope.outputs.in_scope == 'true'
        run: dotnet restore trusted/src/maf-autopilot/maf-autopilot.csproj --locked-mode

      - name: Build trusted-base maf-doctor verifier
        # Build from the trusted base checkout, never from PR-controlled source.
        #
        # continue-on-error: true — round-2 review fixup (same pattern as
        # maf-release-watcher.yml / maf-pr-audit.yml). Without this, a build
        # failure here skipped every downstream step (including the sticky
        # PR comment steps, which all implicitly require success()), so an
        # in-scope PR got a red required check with no explanation at all.
        # The "Run verify-registry" step below now detects the missing DLL
        # and reports a clear message instead.
        continue-on-error: true
        if: steps.scope.outputs.in_scope == 'true'
        run: dotnet build trusted/src/maf-autopilot/maf-autopilot.csproj -c Release -f net8.0 --no-restore

      # Round-3 review fixup — continue-on-error on both Python-toolchain
      # steps below, matching the .NET steps above. Without this, a transient
      # setup-python/pip failure skipped "Run cross-file consistency check"
      # and every step after it via the implicit success() gate, leaving a
      # red required check with no PR comment. "Run cross-file consistency
      # check" already has its own continue-on-error + exit-code capture, so
      # it still runs, fails informatively (python3/pyyaml missing surfaces
      # in its captured output), and the existing failure-comment steps fire
      # instead of being skipped.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        continue-on-error: true
        if: steps.scope.outputs.in_scope == 'true'
        with:
          python-version: '3.12'

      - name: Install Python deps for cross-file check
        continue-on-error: true
        if: steps.scope.outputs.in_scope == 'true'
        # F-13 — exact-pinned rather than floating latest.
        run: pip install pyyaml==6.0.1

      - name: Run verify-registry (rung-1 mechanical)
        id: verify
        if: steps.scope.outputs.in_scope == 'true'
        continue-on-error: true
        env:
          # Validate the PR's LIVE registry, not the embedded (last-published)
          # copy baked into the installed tool — so this C# gate and the Python
          # cross-file gate below inspect the SAME document. Safe now that
          # IsIncompleteDraft skips (never fails) any not-yet-complete entry, so a
          # partially-filled OLD draft can't red an unrelated PR; keep-breaking-red
          # for CURRENT-cycle drafts stays with the Python gate (version-scoped).
          MAF_REGISTRY_PATH: ${{ github.workspace }}/pr/.github/skills/maf-obsolete-api-registry/registry.yaml
        run: |
          set +e
          MAF_DOCTOR="trusted/src/maf-autopilot/bin/Release/net8.0/maf-doctor.dll"
          if [ ! -f "$MAF_DOCTOR" ]; then
            OUTPUT="The trusted-base maf-doctor verifier failed to build (see the build step above) — verification could not run."
            EXIT=1
          else
            OUTPUT=$(dotnet "$MAF_DOCTOR" verify-registry 2>&1)
            EXIT=$?
          fi
          echo "$OUTPUT"
          # F-29 (2026-07-19 security assessment) — OUTPUT can echo content
          # derived from the PR's own registry.yaml (a fork-supplied, possibly
          # adversarial file this step validates). A fixed "EOF" delimiter
          # would let a crafted registry entry containing a standalone "EOF"
          # line close the heredoc early, letting the remainder of OUTPUT be
          # parsed as literal `key=value` GITHUB_OUTPUT lines instead of the
          # `output` value. Generate a random delimiter per run and confirm
          # it can't collide with OUTPUT's own content before using it.
          DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          ATTEMPT=0
          while grep -qF "$DELIM" <<< "$OUTPUT"; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge 20 ]; then
              echo "::error::Could not find a GITHUB_OUTPUT delimiter that doesn't collide with the tool's own output after 20 attempts — refusing to proceed rather than risk a corrupted GITHUB_OUTPUT file."
              exit 1
            fi
            DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          done
          {
            echo "output<<$DELIM"
            echo "$OUTPUT"
            echo "$DELIM"
            echo "exit_code=$EXIT"
          } >> $GITHUB_OUTPUT
          exit $EXIT

      - name: Run cross-file consistency check
        id: crossfile
        if: steps.scope.outputs.in_scope == 'true'
        continue-on-error: true
        run: |
          set +e
          OUTPUT=$(cd pr && python3 ../trusted/.github/scripts/verify_crossfile_consistency.py 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          # F-29 — same rationale as the verify-registry step above: this
          # script also reports on the PR's own registry.yaml content, so use
          # a random delimiter rather than a fixed "EOF".
          DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          ATTEMPT=0
          while grep -qF "$DELIM" <<< "$OUTPUT"; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge 20 ]; then
              echo "::error::Could not find a GITHUB_OUTPUT delimiter that doesn't collide with the tool's own output after 20 attempts — refusing to proceed rather than risk a corrupted GITHUB_OUTPUT file."
              exit 1
            fi
            DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          done
          {
            echo "output<<$DELIM"
            echo "$OUTPUT"
            echo "$DELIM"
            echo "exit_code=$EXIT"
          } >> $GITHUB_OUTPUT
          exit $EXIT

      - name: Preserve watcher scaffold obligations
        id: delta
        if: steps.scope.outputs.in_scope == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.trusted_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set +e
          TRUSTED_DELTA=trusted/.github/scripts/verify_ai_fill_delta.py
          TRUSTED_TREE=$(git -C pr ls-tree "$BASE_SHA" -- .github/scripts/verify_ai_fill_delta.py 2>&1)
          TRUSTED_TREE_EXIT=$?
          TRUSTED_MODE=${TRUSTED_TREE%% *}
          if [ "$TRUSTED_TREE_EXIT" -ne 0 ]; then
            OUTPUT="Could not inspect the trusted-base scaffold verifier. Refusing to continue."
            EXIT=1
          elif [ -n "$TRUSTED_TREE" ] && { [ "$TRUSTED_MODE" != "100644" ] || [ ! -f "$TRUSTED_DELTA" ] || [ -L "$TRUSTED_DELTA" ]; }; then
            OUTPUT="Trusted-base scaffold verifier is not a regular Git file with mode 100644. Refusing to execute it."
            EXIT=1
          elif [ -n "$TRUSTED_TREE" ]; then
            OUTPUT=$(python3 "$TRUSTED_DELTA" \
              --repo pr \
              --head-root pr \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF" 2>&1)
            EXIT=$?
          else
            # One-time bootstrap for the infrastructure PR that first adds the
            # trusted delta verifier. This path must never approve a release
            # scaffold: the tracked version must be unchanged, HEAD must add the
            # verifier as data, and no obligations contract may exist in HEAD.
            # Once this PR lands, every later base contains TRUSTED_DELTA and the
            # full immutable-contract verifier above is mandatory.
            BASE_VERSION=$(git -C pr show "${BASE_SHA}:.maf-version" 2>&1)
            BASE_VERSION_EXIT=$?
            HEAD_VERSION=$(git -C pr show "${HEAD_SHA}:.maf-version" 2>&1)
            HEAD_VERSION_EXIT=$?
            git -C pr cat-file -e "${HEAD_SHA}:.github/scripts/verify_ai_fill_delta.py" 2>/dev/null
            HEAD_VERIFIER_EXIT=$?
            VERIFIER_CHANGE=$(git -C pr diff --name-status "$BASE_SHA" "$HEAD_SHA" -- .github/scripts/verify_ai_fill_delta.py 2>&1)
            VERIFIER_CHANGE_EXIT=$?
            VERIFIER_TREE=$(git -C pr ls-tree "$HEAD_SHA" -- .github/scripts/verify_ai_fill_delta.py 2>&1)
            VERIFIER_TREE_EXIT=$?
            VERIFIER_MODE=${VERIFIER_TREE%% *}
            BASE_CONTRACT_FILES=$(git -C pr ls-tree -r --name-only "$BASE_SHA" -- .github/maf-scaffold-obligations/ 2>&1)
            BASE_CONTRACT_LIST_EXIT=$?
            HEAD_CONTRACT_FILES=$(git -C pr ls-tree -r --name-only "$HEAD_SHA" -- .github/maf-scaffold-obligations/ 2>&1)
            HEAD_CONTRACT_LIST_EXIT=$?

            if [ "$BASE_VERSION_EXIT" -ne 0 ] || [ "$HEAD_VERSION_EXIT" -ne 0 ] \
               || [ "$HEAD_VERIFIER_EXIT" -ne 0 ] || [ "$VERIFIER_CHANGE_EXIT" -ne 0 ] \
               || [ "$VERIFIER_TREE_EXIT" -ne 0 ] \
               || [ "$BASE_CONTRACT_LIST_EXIT" -ne 0 ] || [ "$HEAD_CONTRACT_LIST_EXIT" -ne 0 ]; then
              OUTPUT="Trusted scaffold verifier is absent and its bootstrap preconditions could not be proven. Refusing to continue."
              EXIT=1
            elif [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
              OUTPUT="Trusted scaffold verifier is absent while .maf-version changes from ${BASE_VERSION} to ${HEAD_VERSION}. A release scaffold may not use the bootstrap path."
              EXIT=1
            elif [ "$VERIFIER_CHANGE" != $'A\t.github/scripts/verify_ai_fill_delta.py' ]; then
              OUTPUT="Trusted scaffold verifier is absent, but HEAD does not add it as a new file. Refusing the bootstrap path."
              EXIT=1
            elif [ "$VERIFIER_MODE" != "100644" ]; then
              OUTPUT="Trusted scaffold verifier bootstrap requires a regular non-executable Git file (mode 100644); refusing mode ${VERIFIER_MODE}."
              EXIT=1
            elif [ -n "$BASE_CONTRACT_FILES" ] || [ -n "$HEAD_CONTRACT_FILES" ]; then
              OUTPUT="Trusted scaffold verifier is absent while scaffold-obligation files exist in BASE or HEAD. A release scaffold may not use the bootstrap path."
              EXIT=1
            else
              OUTPUT="One-time trusted-verifier bootstrap accepted: .maf-version remains ${HEAD_VERSION}, HEAD introduces the verifier, and no release scaffold obligations exist."
              EXIT=0
            fi
          fi
          echo "$OUTPUT"
          DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          ATTEMPT=0
          while grep -qF "$DELIM" <<< "$OUTPUT"; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge 20 ]; then
              echo "::error::Could not safely encode scaffold-preservation output."
              exit 1
            fi
            DELIM="EOF_${RANDOM}${RANDOM}${RANDOM}"
          done
          {
            echo "output<<$DELIM"
            echo "$OUTPUT"
            echo "$DELIM"
            echo "exit_code=$EXIT"
          } >> $GITHUB_OUTPUT
          exit $EXIT

      # SEC-11: build the sticky-comment body (failure detail OR a passed message) and
      # upload it as an artifact instead of posting it here — this job handles
      # PR-supplied data, so it must not hold write scope. The workflow_run companion
      # (maf-pr-audit-comment.yml) posts it from the base-repo context. Task 4.8: still a
      # single sticky comment (header maf-ai-fill-verify), updated per PR.
      - name: Signature oracle (report-only, Q-02)
        # Checks every new entry's API claims against the real packages in the
        # train lock: the obsolete member must exist in the old package, the
        # replacement member in the new one. REPORT-ONLY for now (not part of the
        # final status) until it has run clean on real trains; across 1.10-1.23
        # its only findings were real mis-attributions.
        id: oracle
        if: steps.scope.outputs.in_scope == 'true' && startsWith(github.head_ref, 'release-watcher/maf-')
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.trusted_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          dotnet tool install --global dotnet-inspect --version 0.9.1 >/dev/null 2>&1 \
            || dotnet tool update --global dotnet-inspect --version 0.9.1 >/dev/null 2>&1
          MERGE_BASE=$(git -C pr merge-base "$BASE_SHA" "$HEAD_SHA")
          OLD=$(git -C pr show "${MERGE_BASE}:.maf-version" | tr -d '\r\n')
          NEW=$(tr -d '\r\n' < pr/.maf-version)
          python3 trusted/.github/scripts/verify_registry_signatures.py \
            --registry pr/.github/skills/maf-obsolete-api-registry/registry.yaml \
            --train-lock pr/.github/maf-train-lock.json \
            --old-version "$OLD" --version "$NEW" \
            --dotnet-inspect dotnet-inspect \
            --report-out "$RUNNER_TEMP/signature-oracle.md"
          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" -ne 0 ] && echo "::warning title=Signature oracle::$RC (report-only); see the verify comment."
          exit 0

      - name: Compiler oracle (report-only, Q-02)
        # Compiles every new entry's example_before against the old packages and
        # example_after against the new ones (the train lock's exact versions),
        # and checks that a cs_warning naming a compiler diagnostic appears when
        # the old code meets the new packages. Only Microsoft.Agents.AI* ids are
        # restored, and the trusted maf-doctor compiles the PR's snippets with
        # Roslyn without running anything. REPORT-ONLY until it has run clean on
        # real trains; on 1.10-1.23 it found examples that do not compile and
        # cs_warning codes that a user never sees.
        id: compile_oracle
        if: steps.scope.outputs.in_scope == 'true' && startsWith(github.head_ref, 'release-watcher/maf-')
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.trusted_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          MERGE_BASE=$(git -C pr merge-base "$BASE_SHA" "$HEAD_SHA")
          OLD=$(git -C pr show "${MERGE_BASE}:.maf-version" | tr -d '\r\n')
          NEW=$(tr -d '\r\n' < pr/.maf-version)
          python3 trusted/.github/scripts/verify_registry_examples.py \
            --registry pr/.github/skills/maf-obsolete-api-registry/registry.yaml \
            --train-lock pr/.github/maf-train-lock.json \
            --old-version "$OLD" --version "$NEW" \
            --maf-doctor "dotnet trusted/src/maf-autopilot/bin/Release/net8.0/maf-doctor.dll" \
            --work-dir "$RUNNER_TEMP/examples" \
            --report-out "$RUNNER_TEMP/compiler-oracle.md"
          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" -ne 0 ] && echo "::warning title=Compiler oracle::$RC (report-only); see the verify comment."
          exit 0

      - name: Build verify comment body
        if: steps.scope.outputs.in_scope == 'true'
        env:
          VERIFY_OUTPUT: ${{ steps.verify.outputs.output }}
          CROSSFILE_OUTPUT: ${{ steps.crossfile.outputs.output }}
          DELTA_OUTPUT: ${{ steps.delta.outputs.output }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
          CROSSFILE_EXIT: ${{ steps.crossfile.outputs.exit_code }}
          DELTA_EXIT: ${{ steps.delta.outputs.exit_code }}
        run: |
          if [ "$VERIFY_EXIT" = "0" ] && [ "$CROSSFILE_EXIT" = "0" ] \
             && [ "$DELTA_EXIT" = "0" ]; then
            echo "✅ AI-fill verification passed (registry + cross-file + scaffold-preservation checks)." > ai-fill-verify-comment.md
          else
            {
              echo "## ❌ AI-fill verification failed"
              echo ""
              if [ "$VERIFY_EXIT" != "0" ]; then
                echo "### Registry entry checks (rung-1 mechanical)"
                echo ""
                echo '```'
                # SEC-18: the output derives from the PR's own (possibly adversarial)
                # registry.yaml — neutralize any ``` so it can't escape this fence.
                printf '%s\n' "$VERIFY_OUTPUT" | python3 trusted/.github/scripts/neutralize_fences.py
                echo '```'
                echo ""
              fi
              if [ "$CROSSFILE_EXIT" != "0" ]; then
                echo "### Cross-file consistency checks"
                echo ""
                echo '```'
                printf '%s\n' "$CROSSFILE_OUTPUT" | python3 trusted/.github/scripts/neutralize_fences.py
                echo '```'
                echo ""
              fi
              if [ "$DELTA_EXIT" != "0" ]; then
                echo "### Watcher scaffold preservation"
                echo ""
                echo '```'
                printf '%s\n' "$DELTA_OUTPUT" | python3 trusted/.github/scripts/neutralize_fences.py
                echo '```'
                echo ""
              fi
              echo "**Common fixes:**"
              echo "- example_before == example_after -> these must differ."
              echo "- fix_description too short -> write a real sentence, no TODO/TBD."
              echo "- unbalanced braces -> bot truncated a code block."
              echo "- guide_section placeholder -> use 'N/A' literal."
              echo "- duplicate version row -> UPDATE the watcher placeholder, do NOT add a row."
              echo "- Version Tracking section stale -> bump 'Current tracked version' to match .maf-version."
            } > ai-fill-verify-comment.md
          fi
          # Q-02 signature oracle: report-only, appended whether or not it passed.
          if [ -f "$RUNNER_TEMP/signature-oracle.md" ]; then
            {
              echo ""
              echo "### Signature oracle (report-only)"
              echo ""
              echo '```'
              python3 trusted/.github/scripts/neutralize_fences.py < "$RUNNER_TEMP/signature-oracle.md"
              echo '```'
            } >> ai-fill-verify-comment.md
          fi
          # Q-02 compiler oracle: report-only, appended whether or not it passed.
          if [ -f "$RUNNER_TEMP/compiler-oracle.md" ]; then
            {
              echo ""
              echo "### Compiler oracle (report-only)"
              echo ""
              echo '```'
              python3 trusted/.github/scripts/neutralize_fences.py < "$RUNNER_TEMP/compiler-oracle.md"
              echo '```'
            } >> ai-fill-verify-comment.md
          fi

      - name: Write PR number for the comment companion
        if: steps.scope.outputs.in_scope == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Upload verify result for the comment companion (SEC-11)
        if: steps.scope.outputs.in_scope == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maf-ai-fill-verify-result
          path: |
            ai-fill-verify-comment.md
            pr-number.txt

      - name: Final status (fail if any check failed)
        if: |
          steps.scope.outputs.in_scope == 'true' &&
          (steps.verify.outputs.exit_code != '0' ||
           steps.crossfile.outputs.exit_code != '0' ||
           steps.delta.outputs.exit_code != '0')
        run: |
          echo "Verification failed — see PR comment for detail."
          exit 1
