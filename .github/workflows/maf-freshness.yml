name: MAF Knowledge Freshness

# O-01 (ROADMAP): measure what users experience. The Drift Detector grades this
# repository's code and stayed green while the shipped registry fell six MAF
# releases behind (2026-08 → 10). This job compares the MAF release covered on
# `main` and in the latest maf-doctor release tag with upstream nuget.org, and
# keeps one rolling issue open while the SLO is breached.

on:
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maf-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the freshness SLO
        id: check
        run: |
          set -uo pipefail
          MAIN_VERSION=$(tr -d '\r\n' < .maf-version)
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          SHIPPED_VERSION=""
          if [ -n "$LATEST_TAG" ]; then
            SHIPPED_VERSION=$(git show "$LATEST_TAG:.maf-version" 2>/dev/null | tr -d '\r\n' || true)
          fi
          echo "main=$MAIN_VERSION latest tag=$LATEST_TAG shipped=$SHIPPED_VERSION"
          ARGS=(--main-version "$MAIN_VERSION" --report-out "$RUNNER_TEMP/freshness.md")
          if [ -n "$SHIPPED_VERSION" ]; then ARGS+=(--shipped-version "$SHIPPED_VERSION"); fi
          python3 .github/scripts/check_freshness.py "${ARGS[@]}"
          RC=$?
          cat "$RUNNER_TEMP/freshness.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 2 ]; then
            echo "::error::Freshness is unknown (nuget.org unreadable); failing rather than reporting fresh."
            exit 1
          fi

      - name: Discover untracked MAF packages (Z-06)
        id: discover
        # The watcher diffs only the surfaces in maf-package-surfaces.json; 24 of
        # 35 MAF packages went undiffed for months because nothing looked.
        run: |
          set -uo pipefail
          python3 .github/scripts/discover_maf_packages.py --report-out "$RUNNER_TEMP/discovery.md"
          RC=$?
          cat "$RUNNER_TEMP/discovery.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 2 ]; then
            echo "::error::Package discovery is unknown (nuget.org unreadable or config invalid)."
            exit 1
          fi

      - name: Open, update, or close the untracked-packages issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RC: ${{ steps.discover.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="🆕 New Microsoft.Agents.AI packages are not tracked"
          NUM=$(gh issue list --label maf-release --state open --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          { cat "$RUNNER_TEMP/discovery.md"; echo; echo "Latest check: ${RUN_URL}"; } > "$RUNNER_TEMP/discovery-issue.md"
          if [ "$RC" = "1" ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file "$RUNNER_TEMP/discovery-issue.md"
            else
              gh issue create --title "$TITLE" --label maf-release --body-file "$RUNNER_TEMP/discovery-issue.md"
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "All MAF packages are tracked or deliberately ignored: ${RUN_URL}"
          fi

      - name: Open, update, or close the freshness issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RC: ${{ steps.check.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create maf-release --color 0E8A16 \
            --description "Auto-generated by maf-release-watcher / fill workflows" --force || true
          TITLE="🟠 MAF knowledge is stale (freshness SLO breached)"
          NUM=$(gh issue list --label maf-release --state open --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          { cat "$RUNNER_TEMP/freshness.md"; echo; echo "Latest check: ${RUN_URL}"; } > "$RUNNER_TEMP/issue.md"
          if [ "$RC" = "1" ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file "$RUNNER_TEMP/issue.md"
              echo "Updated freshness issue #$NUM"
            else
              gh issue create --title "$TITLE" --label maf-release --body-file "$RUNNER_TEMP/issue.md"
              echo "Opened freshness issue"
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Back within the freshness SLO: ${RUN_URL}"
            echo "Closed freshness issue #$NUM"
          fi

      - name: Fail the run while the SLO is breached or packages are untracked
        # A red scheduled run notifies the owner (O-01: a breach is a red run
        # plus the rolling issue); the issues above carry the detail.
        env:
          FRESH_RC: ${{ steps.check.outputs.rc }}
          DISCOVER_RC: ${{ steps.discover.outputs.rc }}
        run: |
          if [ "$FRESH_RC" != "0" ] || [ "$DISCOVER_RC" != "0" ]; then
            echo "::error::Freshness SLO breached (rc=$FRESH_RC) or untracked MAF packages (rc=$DISCOVER_RC); see the issues."
            exit 1
          fi
          echo "MAF knowledge is fresh and every package is accounted for."
