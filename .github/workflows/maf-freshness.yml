name: MAF Knowledge Freshness

# O-01 (ROADMAP): measure what users experience. The Drift Detector grades this
# repository's code and stayed green while the shipped registry fell six MAF
# releases behind (2026-08 → 10). This job compares the MAF release covered on
# `main` and in the latest maf-doctor release tag with upstream nuget.org, and
# keeps one rolling issue open while the SLO is breached.

on:
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maf-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the freshness SLO
        id: check
        run: |
          set -uo pipefail
          MAIN_VERSION=$(tr -d '\r\n' < .maf-version)
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          SHIPPED_VERSION=""
          if [ -n "$LATEST_TAG" ]; then
            SHIPPED_VERSION=$(git show "$LATEST_TAG:.maf-version" 2>/dev/null | tr -d '\r\n' || true)
          fi
          echo "main=$MAIN_VERSION latest tag=$LATEST_TAG shipped=$SHIPPED_VERSION"
          ARGS=(--main-version "$MAIN_VERSION" --report-out "$RUNNER_TEMP/freshness.md")
          if [ -n "$SHIPPED_VERSION" ]; then ARGS+=(--shipped-version "$SHIPPED_VERSION"); fi
          python3 .github/scripts/check_freshness.py "${ARGS[@]}"
          RC=$?
          cat "$RUNNER_TEMP/freshness.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 2 ]; then
            echo "::error::Freshness is unknown (nuget.org unreadable); failing rather than reporting fresh."
            exit 1
          fi

      - name: Open, update, or close the freshness issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RC: ${{ steps.check.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create maf-release --color 0E8A16 \
            --description "Auto-generated by maf-release-watcher / fill workflows" --force || true
          TITLE="🟠 MAF knowledge is stale (freshness SLO breached)"
          NUM=$(gh issue list --label maf-release --state open --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          { cat "$RUNNER_TEMP/freshness.md"; echo; echo "Latest check: ${RUN_URL}"; } > "$RUNNER_TEMP/issue.md"
          if [ "$RC" = "1" ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file "$RUNNER_TEMP/issue.md"
              echo "Updated freshness issue #$NUM"
            else
              gh issue create --title "$TITLE" --label maf-release --body-file "$RUNNER_TEMP/issue.md"
              echo "Opened freshness issue"
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Back within the freshness SLO: ${RUN_URL}"
            echo "Closed freshness issue #$NUM"
          fi
