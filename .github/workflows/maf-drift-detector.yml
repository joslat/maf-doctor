name: MAF Drift Detector

# Steady-state visibility into MAF best-practice compliance.
# Runs MafDoctor weekly against the repo; opens an issue if the grade
# drops below 'A'. Pair with the watcher (release-triggered updates) for
# the full self-monitoring loop.

on:
  schedule:
    # WM-34: an INDEPENDENT weekly health grade of main. No coordination with the
    # release-watcher is needed — it opens PRs now, it no longer pushes to main, so
    # there is nothing to "settle after". Moved off 11:00 (which collided exactly with
    # mcp-scanner's cron) to spread runner load.
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:        # Manual trigger anytime

permissions:
  contents: read
  issues: write             # Required to open / update the drift issue

# Phase 3.3 — prevent self-overlap (staggered 2h after the watcher above).
concurrency:
  group: maf-self-update-drift
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          # Net8 LTS — install-only; nupkg multi-targets so any flavor works.
          dotnet-version: '8.0.x'

      - name: Restore maf-doctor (locked mode)
        # Round-2 review fixup — docs claimed "CI restores in --locked-mode"
        # as a blanket statement, but this job ran a plain `dotnet build`
        # with an implicit, non-strict restore. Matches build-test.yml's
        # restore-then-build split. No continue-on-error here, matching the
        # build step below: this job's intentional fail-loud design (see
        # notify-on-failure) is unaffected either way.
        run: dotnet restore src/maf-autopilot/maf-autopilot.csproj --locked-mode

      - name: Build maf-doctor from this checkout
        # F-13 (2026-07-19 security assessment) — this job grades THIS repo's
        # own code, so building from the same checkout being graded is
        # strictly more correct than a floating `--prerelease` NuGet install,
        # and this job has `issues: write` in scope.
        run: dotnet build src/maf-autopilot/maf-autopilot.csproj -c Release -f net8.0 --no-restore

      - name: Run MafDoctor against repo
        id: doctor
        run: |
          set -o pipefail
          MAF_DOCTOR="src/maf-autopilot/bin/Release/net8.0/maf-doctor.dll"
          # Scan PRODUCT code only — exclude samples/ and test fixtures, which
          # ship intentional anti-pattern bait that would otherwise force grade
          # F regardless of real health.
          #
          # REP-39: consume the machine-readable JSON contract (schema_version 1)
          # instead of regex-scraping the markdown headline. `verdict` is the
          # single-source grade; `summary_md` carries the SAME markdown report for
          # the issue body — so grade extraction no longer breaks on a prose reword.
          dotnet "$MAF_DOCTOR" doctor "$GITHUB_WORKSPACE" \
            --exclude samples/ --exclude .Tests/ --exclude find-the-bug/ \
            --json > doctor.json
          jq -r '.summary_md // ""' doctor.json > maf-doctor-report.md
          GRADE=$(jq -r '.verdict // "UNKNOWN"' doctor.json)
          if [ -z "$GRADE" ] || [ "$GRADE" = "null" ]; then
            echo "::warning::Could not read verdict from doctor JSON — treating as UNKNOWN."
            GRADE="UNKNOWN"
          fi
          echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
          echo "Detected MAF health grade: $GRADE"

      - name: Upload report as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maf-doctor-report
          path: maf-doctor-report.md

      - name: Fail on unparseable grade (REP-13)
        # A grade of UNKNOWN means the doctor JSON had no `verdict` — a broken doctor
        # run or a contract change. That must be a LOUD tracked failure (which fires
        # the notify-on-failure rolling issue below), NOT a fully-green drift run that
        # silently disables monitoring. Runs after the artifact upload so the report is
        # still inspectable.
        if: steps.doctor.outputs.grade == 'UNKNOWN'
        run: |
          echo "::error title=Drift detector could not read the doctor grade::doctor --json had no 'verdict' — the doctor run failed or its JSON contract changed. Fix before trusting drift monitoring."
          exit 1

      - name: Ensure drift labels exist
        if: steps.doctor.outputs.grade != 'A' && steps.doctor.outputs.grade != 'UNKNOWN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh issue create --label X` hard-fails ("could not add label: 'X'
          # not found") when the label is absent — this is exactly why every
          # scheduled drift run failed. Self-provision the labels idempotently
          # (`--force` upserts) so the workflow never depends on a human having
          # created them. Runs under GITHUB_TOKEN (issues: write).
          gh label create "maf-drift"    --color B60205 --description "MafDoctor grade dropped below A" --force || true
          gh label create "needs-review" --color FBCA04 --description "Awaiting maintainer triage"        --force || true

      - name: Open or update drift issue (if grade != A)
        if: steps.doctor.outputs.grade != 'A' && steps.doctor.outputs.grade != 'UNKNOWN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADE: ${{ steps.doctor.outputs.grade }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # REP-31: cap the report so gh issue create/edit never fails on an oversized
          # body (the GitHub API rejects >65536 chars — the drift report would then never
          # reach the maintainer). Truncate at a line boundary, strip a partial trailing
          # UTF-8 byte; the full report is on the run artifact.
          MAX_BYTES=60000
          if [ "$(wc -c < maf-doctor-report.md)" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" maf-doctor-report.md | sed '$ d' | iconv -f utf-8 -t utf-8 -c > report.trunc.md
            printf '\n\n> ⚠️ **Report truncated** — full report attached as the maf-doctor-report artifact on this run: %s\n' "$RUN_URL" >> report.trunc.md
            mv report.trunc.md maf-doctor-report.md
          fi
          TITLE="🩺 MAF drift detected — current health grade: ${GRADE}"
          BODY=$(cat maf-doctor-report.md)
          BODY="${BODY}

          ---
          _Auto-generated by \`.github/workflows/maf-drift-detector.yml\`. Re-runs weekly._"

          # Look for an existing open issue with the 'maf-drift' label.
          EXISTING=$(gh issue list --label "maf-drift" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing drift issue #$EXISTING"
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            echo "Opening new drift issue"
            gh issue create --title "$TITLE" --body "$BODY" --label "maf-drift,needs-review"
          fi

      - name: Close drift issue (if grade IS A)
        if: steps.doctor.outputs.grade == 'A'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If a previous run opened a drift issue and we're back to 'A', close it.
          EXISTING=$(gh issue list --label "maf-drift" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Repo is back to grade A — closing drift issue #$EXISTING"
            gh issue close "$EXISTING" --comment "✅ Drift resolved — MafDoctor returns grade A on $(date -u +%Y-%m-%d). Closing automatically."
          else
            echo "✅ Grade A — no open drift issue to close."
          fi

  # Phase 2.2 — same failure-notification pattern as the watcher. Opens/de-dupes
  # a maf-release-labelled tracking issue if the drift detector itself fails.
  notify-on-failure:
    needs: [doctor]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          gh label create maf-release --color 0E8A16 \
            --description "Auto-generated by maf-release-watcher / fill workflows" --force || true
          TITLE="🔴 Self-update workflow failed: ${WORKFLOW}"
          NUM=$(gh issue list --label maf-release --state open --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Failed again: ${RUN_URL}"
            echo "Commented on existing failure issue #${NUM}"
          else
            gh issue create --title "${TITLE}" --label maf-release \
              --body "The scheduled **${WORKFLOW}** workflow failed. Most recent failed run: ${RUN_URL}. Updated (not duplicated) on subsequent failures; close once fixed."
            echo "Opened new failure issue"
          fi
