name: MCP server security scan (Cisco mcp-scanner)

# Runs Cisco's mcp-scanner against our MCP server on every PR. The scanner's
# YARA rule set covers the named-attack-class lattice — prompt injection,
# tool poisoning, credential harvesting, code execution patterns, parameter
# injection, cross-origin escalation, rug-pull. Anchored to docs/security.md
# § "MCP-server security scan — Cisco mcp-scanner" + the v1.1 hardening
# plan G8 (added in Phase 6.5).
#
# Why a separate workflow:
#   - The scanner stdio-launches the MCP server process and enumerates its
#     tools. That's expensive enough (build + restore + dotnet run + scan)
#     that we don't want it on every push to a feature branch — only on PRs
#     against main, where the cost is paid once per merge candidate.
#   - Failure was informational at first (continue-on-error: true), to surface
#     findings as a PR annotation without blocking merge during the initial
#     rollout. PROMOTED TO HARD-FAIL on 2026-07-20 after 5 consecutive clean
#     runs (see the job-level comment below for the exact criterion and the
#     rollback playbook if a false-positive lands post-promotion).

on:
  pull_request:
    branches: [main]
    # SEC-30: dropped the nonexistent `src/maf-autopilot.csproj` and added the CPM /
    # build inputs, so a server DEPENDENCY bump (Directory.Packages.props) is scanned
    # pre-merge instead of only at the weekly cron.
    paths:
      - 'src/maf-autopilot/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/mcp-scanner.yml'
  # Weekly cron as a backstop for findings introduced by upstream regex /
  # tooling drift even without code changes on our side.
  schedule:
    - cron: '0 11 * * 1'  # Mondays 11:00 UTC

permissions:
  contents: read

# SEC-12: the scan passes vacuously if the server enumerates no tools ("Total tools
# scanned: 0" + "No results" both match the allowlist). Assert a floor so a partial
# stdio handshake / enumeration regression fails the gate. The real count is 28
# (docs/security.md); 26 leaves slack for a deliberately-removed tool.
env:
  MIN_TOOLS: 26
  # Keep pipx in runner-owned paths. Caching /opt/pipx restored root-owned mode
  # metadata on hosted runners, producing thousands of tar permission warnings
  # and a cache miss on every run even though the scan itself succeeded.
  PIPX_HOME: ${{ github.workspace }}/.pipx
  PIPX_BIN_DIR: ${{ github.workspace }}/.pipx/bin

# WM-35: cancel superseded PR runs (this scan is expensive: build + scan). Cron runs
# never share a PR number, so github.ref keeps them uncancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    # F-16 (2026-07-19 security assessment) — PROMOTED TO HARD-FAIL on
    # 2026-07-20, after verifying 5 consecutive clean runs (not just "job
    # didn't crash" — actual scanner output showing "Total tools scanned: 28
    # / No results match the specified filters." on every run, since the scan
    # step's `|| true` meant job-level success didn't by itself prove a clean
    # scan): runs 29041220523 (2026-07-09), 29248366584 (2026-07-13),
    # 29561981311, 29566236762, 29567785437 (all 2026-07-17), spanning both
    # the PR and cron triggers as this comment originally specified.
    #
    # Rollback playbook (if a false-positive lands):
    #   Do NOT just re-enable `continue-on-error: true` — that loses the
    #   gate's signal value. Instead:
    #     1. Restore `continue-on-error: true` AS A SHORT-TERM UNBLOCK.
    #     2. Open an issue labeled `cisco-mcp-scanner` documenting the YARA
    #        rule that fired, the triggering tool/code path, and whether the
    #        rule warrants an upstream report to cisco-ai-defense/mcp-scanner.
    #     3. Triage within 1 week: either suppress at the source (rule too
    #        aggressive — file upstream), refactor our code (the rule is right
    #        and we drifted), or pin the scanner version below the flagging
    #        release.
    #     4. Remove `continue-on-error: true` again once triaged.
    #   The triage-not-suppress posture is the contract.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache pipx install
        # Explicit PIPX_HOME/PIPX_BIN_DIR above make the install runner-owned and
        # portable across hosted images. Do not cache /opt: tar cannot restore
        # its root-owned permission metadata as the runner user.
        # Key still invalidates on workflow-file edits so version-pin changes
        # force a fresh install instead of resurrecting a stale cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # PIPX_BIN_DIR is a child of PIPX_HOME, so one cache root covers both
          # without archiving the bin directory twice.
          path: ${{ env.PIPX_HOME }}
          key: pipx-cisco-mcp-scanner-${{ hashFiles('.github/workflows/mcp-scanner.yml') }}

      - name: Install Cisco mcp-scanner via pipx
        run: |
          set -e
          python -m pip install --user pipx==1.16.0
          mkdir -p "$PIPX_HOME" "$PIPX_BIN_DIR"
          export PATH="$PIPX_BIN_DIR:$PATH"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          # F-13 (2026-07-19 security assessment) — exact-pinned rather than a
          # `>=4,<5` floating range: a security scanner's OWN supply chain is a
          # high-value target, and this workflow's job carries
          # `pull-requests: write`. Pinned to v4.6.0, the version this repo's
          # "Latest scan results" in docs/security.md was actually recorded
          # against — bump both together deliberately, not automatically.
          pipx install 'cisco-ai-mcp-scanner==4.6.0' || \
            pipx install --force 'cisco-ai-mcp-scanner==4.6.0'
          # Surface the resolved binary path in the workflow log so future
          # debugging doesn't require log-diving. `command -v` is PATH-aware —
          # handles both `~/.local/bin` (default PIPX_BIN_DIR on dev machines)
          # and `/opt/pipx_bin/` (GHA Ubuntu).
          #
          # Note: cisco-ai-mcp-scanner's CLI does NOT support `--version`
          # (verified from `--help` output on v4.7.0). Don't try to invoke
          # it as a sanity probe — `set -e` would kill the step. Trust the
          # pipx-install success line above.
          SCANNER_BIN=$(command -v mcp-scanner || echo "")
          if [ -z "$SCANNER_BIN" ]; then
            echo "::error::mcp-scanner binary not on PATH after pipx install."
            echo "PATH = $PATH"
            echo "pipx environment dump:"
            pipx environment || true
            exit 1
          fi
          echo "mcp-scanner installed at: $SCANNER_BIN"
          # Print the help banner first line as a soft liveness probe (the
          # scanner's argparse exits 0 on --help, so this is safe under set -e).
          "$SCANNER_BIN" --help 2>&1 | head -1 || true

      - name: Build the MCP server (so the scanner can launch it)
        # Build Debug (the default) — `dotnet run --no-build` in the next
        # step defaults to Debug too and looks for `bin/Debug/net10.0/`.
        # The previous version passed `--configuration Release` here but
        # not on the `dotnet run` side, so the scanner crashed with
        # "No such file or directory" trying to launch the Debug binary
        # that was never built (seen on PR #59 run 26213390604).
        # The scanner doesn't need optimized code — it just needs the
        # assemblies to exist for the stdio handshake.
        run: |
          dotnet build src/maf-autopilot/maf-autopilot.csproj \
            --framework net10.0 \
            --nologo

      - name: Run mcp-scanner (yara analyzers, summary format)
        id: scan
        run: |
          # Invoke via PATH-resolved bare command — pipx puts the binary
          # somewhere on PATH (location varies by runner: `~/.local/bin` on
          # dev machines, `/opt/pipx_bin` on GHA Ubuntu). The previous
          # hardcoded `~/.local/bin/mcp-scanner` failed on GHA.
          #
          # The scanner stdio-launches the server we just built. Use
          # --no-build so we don't pay restore + build twice. Pipe stderr
          # to a file so the maintainer can see any server-side bootstrap
          # noise alongside the scanner findings.
          #
          # F-16 — `|| true` here is intentional and NOT the same thing as
          # the removed job-level continue-on-error: this only guarantees
          # scan-results.txt exists even if the CLI itself crashes for an
          # unrelated reason (its exit-code semantics for "findings vs. no
          # findings" are undocumented — see the note on the sanity-probe
          # workaround above). Pass/fail is decided explicitly below by
          # parsing scan-results.txt, not by trusting this exit code.
          mcp-scanner \
            --analyzers yara \
            --format summary \
            --hide-safe \
            stdio \
            --stdio-command=dotnet \
            --stdio-arg=run \
            --stdio-arg=--project \
            --stdio-arg=src/maf-autopilot \
            --stdio-arg=--framework \
            --stdio-arg=net10.0 \
            --stdio-arg=--no-build \
            --stderr-file=/tmp/maf-server.log \
            > scan-results.txt 2> scanner-stderr.log || true
          echo "Scanner output:"
          cat scan-results.txt
          echo ""
          # WM-13: keep the scanner's OWN stderr OUT of the allowlisted results file.
          # A benign stderr line (urllib/Python warning) previously merged into
          # scan-results.txt via 2>&1 and permanently red-ed the allowlist gate. It's
          # visible here in the log but can no longer forge or break the verdict.
          echo "--- Scanner stderr ---"
          cat scanner-stderr.log 2>/dev/null || echo "(empty)"
          echo ""
          echo "--- Server bootstrap log ---"
          cat /tmp/maf-server.log 2>/dev/null || echo "(empty)"

      # SEC-11: this job stdio-launches and scans PR-supplied (possibly fork,
      # untrusted) code, so it must NOT hold `pull-requests: write`. Instead of
      # posting the comment here (which 403s on fork PRs and would need write
      # scope during untrusted execution), build the comment body + PR number and
      # upload them as an artifact; the workflow_run companion
      # (maf-pr-audit-comment.yml) posts the sticky comment from the base-repo
      # context with a write token but WITHOUT ever touching fork code.
      - name: Build PR comment body
        if: github.event_name == 'pull_request' && !cancelled()
        # !cancelled() (not always(), not the implicit success()-only default)
        # — runs whether the scan step above passed or failed the gate below,
        # so the comment explaining WHY still gets produced, unless cancelled.
        run: |
          {
            echo '### 🔍 Cisco mcp-scanner result'
            echo ''
            echo '```'
            # SEC-18: neutralize any ``` in the scanner output so a finding line can't
            # close this fence and inject markdown into the PR comment.
            { cat scan-results.txt 2>/dev/null || echo '(no output)'; } | python3 .github/scripts/neutralize_fences.py
            echo '```'
            # WM-13: surface any scanner stderr in the comment so a maintainer can
            # tell noise from findings without log-diving. Only when non-empty.
            if [ -s scanner-stderr.log ]; then
              echo ''
              echo '<details><summary>Scanner stderr (noise, not findings)</summary>'
              echo ''
              echo '```'
              cat scanner-stderr.log | python3 .github/scripts/neutralize_fences.py
              echo '```'
              echo ''
              echo '</details>'
            fi
            echo ''
            echo '<sub>Scan covers prompt-injection, tool-poisoning, credential-harvesting,'
            echo 'code-execution, parameter-injection, cross-origin-escalation, and rug-pull'
            echo 'patterns. See `docs/security.md` for the canonical interpretation. This'
            echo 'check is a required gate — see the "Run mcp-scanner" step above for the'
            echo 'exact pass/fail evaluation.</sub>'
          } > pr-comment.md

      - name: Write PR number for the comment companion
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}   # numeric; env-redirect per templating discipline
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Upload scan result for the comment companion (SEC-11)
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mcp-scanner-result
          path: |
            pr-comment.md
            pr-number.txt

      - name: Evaluate scan result (hard-fail gate)
        # F-16 — the actual pass/fail decision, deliberately separated from
        # the scan step (which must not fail the job before the PR comment
        # steps above get a chance to run) and from that step's own exit
        # code (undocumented semantics, per the note above).
        #
        # Post-merge fixup (first real CI run after merge) — every prior
        # hardening pass on this gate (see git blame) assumed a clean run's
        # `--hide-safe` summary was exactly two non-blank lines. That
        # assumption was verified extensively against SYNTHETIC bash test
        # fixtures, but never against the REAL scanner's actual output —
        # and it was wrong. The real cisco-ai-mcp-scanner 4.6.0 output
        # (captured byte-for-byte from an actual local run against this
        # server, and matching what broke PR #152's first CI run) is:
        #
        #   === MCP Scanner Results Summary ===
        #   <blank>
        #   Scan Target: stdio:dotnet run --project ... --no-build
        #   Total tools scanned: 28
        #   No results match the specified filters.
        #   <blank, trailing>
        #
        # — 4 non-blank lines, not 2, and CRLF-terminated even though this
        # step runs on ubuntu-latest. The gate hard-failed on EVERY clean
        # scan since it was "hardened" to require exactly 2, defeating the
        # gate's purpose (a security check nobody can ever satisfy isn't
        # a security check, it's a permanent red X). Rebuilt as an
        # allowlist: every non-blank line must match one of the four known
        # boilerplate/result shapes (verbatim header, "Scan Target: "
        # prefix — its suffix is the workflow's own fixed CLI invocation,
        # not attacker-influenced — the tool-count line, and the no-results
        # line), and the two confirmatory lines (tool-count, no-results)
        # must actually be present. Any OTHER line — a real finding, in
        # whatever shape that turns out to be — still fails closed, same
        # as every prior version of this gate. Verified against the real
        # captured clean output (CRLF and LF-normalized), a clean output
        # with a finding line appended, mixed clean+dirty with blank
        # padding, an empty file, a truncated/crashed output, and a
        # findings-only output with no boilerplate at all — the first two
        # now correctly pass; every dirty/malformed case still fails.
        run: |
          if [ ! -s scan-results.txt ]; then
            echo "::error::scan-results.txt is empty — the scan step likely crashed before producing output. Treating as a failure (fail closed)."
            exit 1
          fi

          NONBLANK=$(tr -d '\r' < scan-results.txt | grep -v '^[[:space:]]*$' || true)
          BAD_LINE=$(printf '%s\n' "$NONBLANK" | grep -vE '^=== MCP Scanner Results Summary ===$|^Scan Target: |^Total tools scanned: [0-9]+$|^No results match the specified filters\.$' || true)
          if [ -n "$BAD_LINE" ] \
             || ! printf '%s\n' "$NONBLANK" | grep -qE '^Total tools scanned: [0-9]+$' \
             || ! printf '%s\n' "$NONBLANK" | grep -qE '^No results match the specified filters\.$'; then
            echo "::error::mcp-scanner reported findings (or produced an unexpected output shape) — see the 'Run mcp-scanner' step output above (and the PR comment, if this is a pull_request run)."
            exit 1
          fi
          # SEC-12: a server that enumerates ZERO/too few tools passes the allowlist
          # vacuously ("Total tools scanned: 0" + "No results" both match). Assert a floor
          # so an enumeration regression / partial handshake fails closed.
          N=$(printf '%s\n' "$NONBLANK" | grep -oE '^Total tools scanned: [0-9]+$' | grep -oE '[0-9]+$')
          if [ "${N:-0}" -lt "${MIN_TOOLS}" ]; then
            echo "::error::Only ${N:-0} tools scanned (expected >= ${MIN_TOOLS} — enumeration regressed or the stdio handshake was partial). Failing closed."
            exit 1
          fi
          echo "Clean scan confirmed — no findings (${N} tools scanned)."

  # WM-29: scheduled-scan failures were a silent red X — the same silent-failure class
  # Phase 2.1 fixed for the watcher / drift detector. Scoped to the cron so PR failures
  # (already loud via the required check) don't double-report; dedupes onto its OWN
  # rolling issue (the title carries this workflow's distinct name).
  notify-on-failure:
    needs: [scan]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          gh label create maf-release --color 0E8A16 \
            --description "Auto-generated by maf-release-watcher / fill workflows" --force || true
          TITLE="🔴 Self-update workflow failed: ${WORKFLOW}"
          NUM=$(gh issue list --label maf-release --state open --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Failed again: ${RUN_URL}"
            echo "Commented on existing failure issue #${NUM}"
          else
            gh issue create --title "${TITLE}" --label maf-release \
              --body "The scheduled **${WORKFLOW}** workflow failed. Most recent failed run: ${RUN_URL}. Updated (not duplicated) on subsequent failures; close once fixed."
            echo "Opened new failure issue"
          fi
