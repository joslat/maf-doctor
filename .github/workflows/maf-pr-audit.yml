name: MAF PR Audit

# PR-time check: run the MAF doctor over the repo (PRODUCT code — samples/ and
# test fixtures excluded, like the drift detector) and post the report as a
# sticky PR comment. The changed-file list is used only for the skip / compiler-
# bomb gate below, NOT to scope the scan — this is a whole-repo (product) audit.
# The CI integration vector for plan #52. [task 4.10]

on:
  # SEC-16: NO paths: filter. A required check with a paths filter deadlocks docs-only
  # PRs (the check is "expected" but never runs) — or, if not required, the compiler-bomb
  # red gate can't actually block a merge. Instead the check runs on EVERY PR and the
  # in-job "Decide whether to audit" step below skips (green) when nothing product-code
  # changed, so it reports success on every PR and is safely requireable.
  pull_request: {}

# #148 finding 3 — this job runs Roslyn analysis over the PR's own (possibly
# untrusted, fork-supplied) source, so it must never hold write-scoped
# permissions. GitHub already enforces that for `pull_request` runs from a
# fork (GITHUB_TOKEN is force-downgraded to read-only regardless of what's
# declared here) — declaring only `contents: read` makes the same constraint
# explicit for same-repo PRs too. Posting the actual PR comment is handled by
# the companion workflow maf-pr-audit-comment.yml (triggered by workflow_run),
# which runs in the base repo's context with a normal write-scoped token and
# never touches fork-supplied code — only the plain markdown artifact this
# job produces below.
permissions:
  contents: read

# WM-35: cancel superseded PR runs (this audit is one of the heavier PR jobs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need the base branch ref to compute the diff.
          fetch-depth: 0

      - name: Decide whether to audit (skip if only samples/ changed)
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # samples/ intentionally contains buggy / out-of-date code:
          # - samples/find-the-bug/* has an answer-key.md alongside
          #   intentional anti-patterns (the tutorial IS the point).
          # - samples/maf-1.2-sample/* is the analyzer's test corpus —
          #   patterns valid in MAF 1.2 that later versions flag.
          # Auditing them produces a noisy F grade that doesn't reflect
          # the toolkit's code quality. Skip if EVERY changed code file
          # is under samples/.
          git fetch origin "$BASE_REF":"refs/heads/$BASE_REF" --depth=50 || true
          CHANGED_CODE=$(git diff --name-only "origin/$BASE_REF" HEAD | grep -E '\.(cs|csproj)$' || true)
          NON_SAMPLE=$(echo "$CHANGED_CODE" | grep -v '^samples/' || true)
          echo "Changed .cs/.csproj files in PR:"
          echo "$CHANGED_CODE" | sed 's/^/  /'
          if [ -z "$NON_SAMPLE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            # SEC-16: distinguish "no product code changed at all" (docs-only PR — now
            # reachable since the paths filter was removed) from "only samples/ changed".
            if [ -z "$CHANGED_CODE" ]; then
              echo "skip_reason=no-code" >> $GITHUB_OUTPUT
              echo "::notice title=MAF audit skipped::No .cs/.csproj files changed — nothing to audit."
            else
              echo "skip_reason=samples-only" >> $GITHUB_OUTPUT
              echo "::notice title=MAF audit skipped::Only samples/ files changed — they're intentionally buggy demo corpora, not real code to audit."
            fi
            exit 0
          fi

          # Phase 5.11 (G6 in the hardening plan) — compiler-bomb cap.
          # A malicious PR can submit a small number of .cs files that each
          # exceed several MB (deeply-nested generics, multi-MB attributes,
          # giant XML doc comments) and pin Roslyn-host memory on the runner.
          # Cap the audit at: ≤ 200 changed .cs files AND ≤ 5 MB aggregate.
          # Above either ceiling, skip the Roslyn-heavy audit and surface a
          # warning — the PR can still merge, just without the per-file scan.
          #
          # Phase 5.G fixup — use NUL-separated `git diff -z` + `xargs -0` to
          # handle filenames containing newlines / quotes / spaces (all legal
          # on POSIX). The prior `xargs -I {} sh -c '... "{}"'` form is
          # broken by a filename containing `"` (legal on Linux/macOS).
          # We re-fetch the changed file list as NUL-separated bytes instead
          # of parsing the already-newline-split list.
          mapfile -d '' CHANGED_NUL < <(git diff -z --name-only "origin/$BASE_REF" HEAD -- '*.cs')
          COUNT=${#CHANGED_NUL[@]}
          # Strip trailing empty entry that mapfile may add on a NUL-terminated input.
          if [ "$COUNT" -gt 0 ] && [ -z "${CHANGED_NUL[$((COUNT-1))]}" ]; then
            unset 'CHANGED_NUL[$((COUNT-1))]'
            COUNT=${#CHANGED_NUL[@]}
          fi

          if [ "$COUNT" -gt 0 ]; then
            TOTAL_BYTES=0
            for f in "${CHANGED_NUL[@]}"; do
              if [ -f "$f" ]; then
                # `stat -c %s --` is POSIX-friendly and never re-interprets the
                # filename through a shell parser.
                SZ=$(stat -c %s -- "$f" 2>/dev/null || echo 0)
                TOTAL_BYTES=$((TOTAL_BYTES + SZ))
              fi
            done
            echo "Compiler-bomb cap check: $COUNT .cs files, $TOTAL_BYTES bytes total."
            if [ "$COUNT" -gt 200 ] || [ "$TOTAL_BYTES" -gt 5242880 ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "skip_reason=compiler-bomb-cap" >> $GITHUB_OUTPUT
              echo "changed_file_count=$COUNT" >> $GITHUB_OUTPUT
              echo "changed_bytes=$TOTAL_BYTES" >> $GITHUB_OUTPUT
              echo "::warning title=MAF audit skipped (compiler-bomb cap)::PR changes $COUNT .cs files / $TOTAL_BYTES bytes. Caps are 200 files / 5 MB. Roslyn-heavy audit skipped to protect the runner; CI-side scanners still run."
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Setup .NET
        # Round-3 review fixup — continue-on-error so a transient setup-dotnet
        # failure (network/registry hiccup) doesn't skip every downstream step
        # via the implicit success() gate, which would leave this job's
        # required check red with no artifact and no PR comment (the same
        # class of gap the Restore/Build continue-on-error below already
        # closes for build/restore failures specifically).
        continue-on-error: true
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore maf-doctor (locked mode)
        # Round-2 review fixup — docs claimed "CI restores in --locked-mode"
        # as a blanket statement, but this job ran a plain `dotnet build`
        # with an implicit, non-strict restore. Matches build-test.yml's
        # restore-then-build split. continue-on-error for the same reason as
        # the build step below: a broken PR can legitimately fail restore
        # too, and that must not crash the companion comment workflow.
        continue-on-error: true
        if: steps.scope.outputs.skip != 'true'
        run: dotnet restore src/maf-autopilot/maf-autopilot.csproj --locked-mode

      - name: Build maf-doctor from this checkout
        # F-13 (2026-07-19 security assessment) — this job audits the PR's own
        # (possibly fork-supplied) source with maf-doctor; building maf-doctor
        # itself from the SAME trusted checkout that produced this job's
        # source tree (not a floating `--prerelease` NuGet install) means the
        # tool doing the auditing is exactly the reviewed code at this commit,
        # not whatever happens to be newest on NuGet at run time.
        #
        # continue-on-error: true — round-2 review fixup (mirrors the same
        # fixup already applied to maf-release-watcher.yml for the identical
        # F-13 refactor). This job's own audited source can legitimately fail
        # to compile (that's what build-test.yml, a separate required check,
        # exists to catch); without this, a broken PR skips every downstream
        # step here — including "Upload audit result" — so the companion
        # workflow maf-pr-audit-comment.yml downloads a nonexistent artifact
        # and crashes with no PR-visible comment instead of the graceful
        # "audit incomplete" message below.
        continue-on-error: true
        if: steps.scope.outputs.skip != 'true'
        run: dotnet build src/maf-autopilot/maf-autopilot.csproj -c Release -f net8.0 --no-restore

      - name: Run maf-doctor doctor (whole-repo, product-scoped)
        # REP-41: this is the whole-repo, product-scoped `doctor` report (not the
        # diff-scoped MafAuditPullRequest MCP tool) — the step name + steering docs
        # now say so.
        if: steps.scope.outputs.skip != 'true'
        id: audit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The MCP tool needs the base branch fetched locally as a branch ref.
          git fetch origin "$BASE_REF":"refs/heads/$BASE_REF" --depth=50 || true

          MAF_DOCTOR="src/maf-autopilot/bin/Release/net8.0/maf-doctor.dll"

          # Defensive check for the continue-on-error build step above: a
          # broken PR can fail to compile maf-doctor itself. Surface that
          # plainly instead of letting `dotnet <missing-dll>` produce a
          # cryptic "file not found" error in the sticky comment.
          if [ ! -f "$MAF_DOCTOR" ]; then
            echo "⚠️ **MAF audit INCOMPLETE for this PR.** maf-doctor failed to build from this checkout (see the 'Build maf-doctor from this checkout' step above) — the mechanical audit could not run. This is usually caused by a compile error in the PR; check the build-test.yml required check for details." > pr-audit-full.md
            echo "maf-doctor build did not produce $MAF_DOCTOR — see the step above."
          else
            # Product-scoped (task 4.10 / 3.1): exclude samples/ + test fixtures so
            # the audit reflects product code, matching the drift detector.
            # REP-29: capture stdout (the markdown report) and stderr SEPARATELY so a
            # stray runtime warning can't corrupt the sticky comment. `|| true` keeps
            # the job alive so we still post diagnostic content.
            rc=0
            dotnet "$MAF_DOCTOR" doctor "$GITHUB_WORKSPACE" \
              --exclude samples/ --exclude .Tests/ --exclude find-the-bug/ \
              > pr-audit-full.md 2> doctor-stderr.txt || rc=$?
            # On failure / empty report, append the stderr as a COLLAPSED diagnostics
            # block (delimited, not interleaved). On success it's only in the job log below.
            if [ "$rc" -ne 0 ] || [ ! -s pr-audit-full.md ]; then
              {
                echo ''
                echo '<details><summary>doctor diagnostics (stderr)</summary>'
                echo ''
                echo '```'
                cat doctor-stderr.txt 2>/dev/null || echo '(none)'
                echo '```'
                echo ''
                echo '</details>'
              } >> pr-audit-full.md
            fi
          fi

          echo "--- doctor stderr ---"; cat doctor-stderr.txt 2>/dev/null || echo "(none)"

          # Defensive fallback: if the doctor invocation produced nothing
          # (empty file), write an explanatory message rather than letting the
          # marocchino sticky-comment action error with "Either message or
          # path input is required" on an empty file.
          if [ ! -s pr-audit-full.md ]; then
            cat > pr-audit-full.md <<'EOF'
          ⚠️ **maf-doctor doctor produced no output.** See this workflow run's logs for the build/run error.
          EOF
          fi

          echo "Full doctor report:"
          cat pr-audit-full.md

      - name: Write skip placeholder (when the audit was intentionally skipped)
        if: steps.scope.outputs.skip == 'true'
        # The "Run MCP server..." step above never runs in this branch, so
        # pr-audit-full.md wouldn't otherwise exist — an artifact must still be
        # produced so the companion workflow can tell "intentionally skipped"
        # apart from "something actually went wrong" (#148 finding 3 review).
        env:
          SKIP_REASON: ${{ steps.scope.outputs.skip_reason }}
          FILE_COUNT: ${{ steps.scope.outputs.changed_file_count }}
          BYTES: ${{ steps.scope.outputs.changed_bytes }}
        run: |
          if [ "$SKIP_REASON" = "compiler-bomb-cap" ]; then
            # F-17 (2026-07-19 security assessment) — exact metrics, and this
            # phrasing deliberately does NOT say "clean" or imply pass/fail:
            # the mechanical audit did not run at all for this PR.
            cat > pr-audit-full.md <<EOF
          ⚠️ **MAF audit INCOMPLETE for this PR.** The Roslyn-heavy per-file audit was skipped: this PR changes $FILE_COUNT .cs files totaling $BYTES bytes, exceeding the 200-file / 5 MB compiler-bomb cap. The CI-side mcp-scanner still ran. A maintainer should manually review this PR's size and content before merging — the automated mechanical audit has NOT evaluated it.
          EOF
          elif [ "$SKIP_REASON" = "no-code" ]; then
            echo "ℹ️ **MAF audit skipped for this PR.** No .cs/.csproj files changed — nothing to audit." > pr-audit-full.md
          else
            echo "ℹ️ **MAF audit skipped for this PR.** Only samples/ files changed — they're intentionally buggy demo corpora, not real code to audit." > pr-audit-full.md
          fi

      - name: Record PR number for the comment workflow
        # No `if:` guard — runs whenever the job reaches this point without an
        # earlier step failing (the implicit default), covering BOTH the
        # skip=true and skip=false success paths so an artifact is always
        # produced for a successful run. workflow_run's `pull_requests` context
        # is empty for fork PRs (a known GitHub Actions limitation) — hand the
        # PR number to the companion workflow explicitly via the artifact
        # instead of relying on it.
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload audit result
        # #148 finding 3 — this job's GITHUB_TOKEN is read-only (enforced by
        # GitHub for fork PRs regardless of the `permissions:` above), so it
        # cannot post the sticky comment itself. maf-pr-audit-comment.yml
        # (workflow_run) downloads this artifact and posts it instead. Always
        # uploading (skip or not) means a successful run of THIS workflow
        # guarantees the artifact exists — the companion workflow can then
        # treat a download failure as a genuine problem instead of having to
        # guess whether it's the expected "audit was skipped" case.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-audit-result
          path: |
            pr-audit-full.md
            pr-number.txt
          retention-days: 1

      - name: Fail — mechanical audit did not run (compiler-bomb cap)
        # F-17 (2026-07-19 security assessment) — the samples-only skip is an
        # intentional, legitimate scope decision and must NOT fail; only the
        # compiler-bomb-cap skip represents a genuine coverage gap. Previously
        # BOTH cases exited the job successfully, so a PR could deliberately
        # exceed the cap to dodge the mechanical audit while every check
        # stayed green. This step runs LAST, after the artifact is already
        # uploaded, so maf-pr-audit-comment.yml still posts the explanatory
        # comment above even though this job's overall conclusion becomes
        # `failure` (see that workflow's trigger condition).
        if: steps.scope.outputs.skip_reason == 'compiler-bomb-cap'
        run: |
          echo "::error title=MAF audit incomplete::This PR's mechanical audit did not run (compiler-bomb cap exceeded). A maintainer must manually review before merging."
          exit 1
