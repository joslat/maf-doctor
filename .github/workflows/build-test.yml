name: build-test

# Builds and runs the full .NET test suite on every PR and push to main.
#
# Why this exists: before this workflow, `dotnet test` ran ONLY in release.yml
# (triggered by a release tag), so the entire test suite — including the rewriter
# compile-roundtrip corruption guard (RewriterCompileRoundtripTests, which catches
# the CS1995 / CS4004 "await injected into an await-illegal context" class of source
# corruption) — never gated a pull request. It surfaced only weeks later, at release.
#
# This makes the suite a real pre-merge gate: a rewriter (or any) regression fails
# here, on the PR, before merge.

on:
  push:
    branches: [main]
  pull_request:

# WM-35: cancel superseded PR runs so rapid pushes don't queue redundant full builds.
# Push-to-main runs are NOT cancelled (main's history stays fully tested); only an
# already-superseded PR head is cancelled the moment a newer head arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (net8/9/10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET (all three runtimes — project multi-targets net8/9/10)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        # F-27 — locked mode fails the restore if a project's
        # packages.lock.json disagrees with Directory.Packages.props, instead
        # of quietly resolving to whatever the transitive graph produces that
        # day. A real dependency bump must update the lock file in the same
        # commit (`dotnet restore --force-evaluate`) or CI catches the drift.
        run: dotnet restore maf-autopilot.sln --locked-mode

      - name: Build
        run: dotnet build maf-autopilot.sln --configuration Release --no-restore

      - name: Test (solution-level — gates analyzer + main project + rewriter compile-roundtrip guard)
        run: |
          dotnet test maf-autopilot.sln \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=minimal"

      - name: MCP round trip (handshake + stateless 2026-07-28)
        # M-02: a real client/server exchange on every PR. Lists every tool,
        # prompt, resource and template, reads every resource, renders the
        # argument-free prompts, makes a real tool call, and repeats discovery
        # and a call over the stateless 2026-07-28 flow. Unit tests alone did not
        # cover the wire protocol, which an SDK upgrade can change.
        run: python3 .github/scripts/mcp_smoke.py -- dotnet src/maf-autopilot/bin/Release/net10.0/maf-doctor.dll
