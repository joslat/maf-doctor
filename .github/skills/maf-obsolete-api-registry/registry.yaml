  - id: MAF11-SKILL-PROVIDER-001
    package: Microsoft.Agents.AI
    version_introduced: "1.1.0"
    type: "AgentSkillsProvider"
    method: ".ctor"
    obsolete_signature: "void .ctor(System.Collections.Generic.IEnumerable<Microsoft.Agents.AI.AgentInlineSkill> skills, Microsoft.Agents.AI.AgentSkillsProviderOptions? options = null, Microsoft.Extensions.Logging.ILoggerFactory? loggerFactory = null)"
    replacement_signature: "void .ctor(System.Collections.Generic.IEnumerable<Microsoft.Agents.AI.AgentSkill> skills, Microsoft.Agents.AI.AgentSkillsProviderOptions? options = null, Microsoft.Extensions.Logging.ILoggerFactory? loggerFactory = null)"
    argument_order_change: false
    fix_description: "Both `AgentSkillsProvider` constructors (params array and IEnumerable) now take the base `AgentSkill` instead of `AgentInlineSkill`. `AgentInlineSkill` inherits `AgentSkill`, so source calls compile unchanged; rebuild binaries built against 1.0."
    example_before: |
      var provider = new AgentSkillsProvider(new List<AgentInlineSkill> { skill });
    example_after: |
      var provider = new AgentSkillsProvider(new List<AgentSkill> { skill });
    cs_warning: BINARY_BREAK
    guide_section: "N/A"
    dotnet_inspect_detectable: true
    applies_to_codebases: "pre-1.1.0"
    notes: "Backfilled 2026-10-01 from a dotnet-inspect 0.9.1 diff of Microsoft.Agents.AI 1.0.0..1.1.0; releases before the 1.3.0 baseline were never diffed release by release. The same release added AgentClassSkill<T>, which the base-type parameter accepts. The diff also shows the params overload changing: void .ctor(params Microsoft.Agents.AI.AgentInlineSkill[] skills) -> void .ctor(params Microsoft.Agents.AI.AgentSkill[] skills)."

