# MAF Obsolete API Registry
# Machine-readable source of truth for all known CS0618 warnings.
# Update this file whenever a new CS0618 warning is encountered in any MAF migration.
#
# Format: see .github/skills/maf-obsolete-api-registry/SKILL.md

schema_version: "1.0"
target_maf_version: "1.23.0"
last_updated: "2026-10-01"

entries:

  - id: MAF11-SKILL-INLINE-001
    package: Microsoft.Agents.AI
    version_introduced: "1.1.0"
    type: "AgentInlineSkill"
    method: ".ctor"
    obsolete_signature: "void .ctor(string name, string description, string instructions, string? license = null, string? compatibility = null, string? allowedTools = null, Microsoft.Extensions.AI.AdditionalPropertiesDictionary? metadata = null)"
    replacement_signature: "void .ctor(string name, string description, string instructions, string? license = null, string? compatibility = null, string? allowedTools = null, Microsoft.Extensions.AI.AdditionalPropertiesDictionary? metadata = null, System.Text.Json.JsonSerializerOptions? serializerOptions = null)"
    argument_order_change: false
    fix_description: "Both `AgentInlineSkill` constructors (name/description and frontmatter) gained an optional trailing `serializerOptions`. Source calls compile unchanged; rebuild binaries built against 1.0."
    example_before: |
      var skill = new AgentInlineSkill("triage", "Triage tickets", instructions);
    example_after: |
      var skill = new AgentInlineSkill("triage", "Triage tickets", instructions, serializerOptions: jsonOptions);
    cs_warning: BINARY_BREAK
    guide_section: "N/A"
    dotnet_inspect_detectable: true
    applies_to_codebases: "pre-1.1.0"
    notes: "Backfilled 2026-10-01 from a dotnet-inspect 0.9.1 diff of Microsoft.Agents.AI 1.0.0..1.1.0; releases before the 1.3.0 baseline were never diffed release by release. The diff also shows the frontmatter overload changing: void .ctor(Microsoft.Agents.AI.AgentSkillFrontmatter frontmatter, string instructions) -> void .ctor(Microsoft.Agents.AI.AgentSkillFrontmatter frontmatter, string instructions, System.Text.Json.JsonSerializerOptions? serializerOptions = null)."

