              Render(update.Text);
          }

          if (update.RawRepresentation is AgentResponseEvent completion)
          {
              foreach (ChatMessage message in completion.Response.Messages)
              {
                  ObserveCompletion(completion.ExecutorId, message.MessageId);
              }
