      code to AGUI.Client, server adapters to AGUI.Server, and events/messages/tools to
      AGUI.Abstractions; add AGUI.Protobuf only for protobuf transport and AGUI.Formatting
      for wire-format helpers. A requested Microsoft.Agents.AI.AGUI 1.14 package cannot
